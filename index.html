<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Konbini Hoshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Mise en page : scène 3D plein écran, bandeau d'état en haut, tiroir d'actions en bas */
  --bg:#0f2f2e;
  --panel:#173f3d;
  --panel-2:#215450;
  --ink:#fbf7ec;
  --mint:#7ef0c4;
  --amber:#ffb347;
  --mute:#a4cdc2;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;background:#8fd3f4}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:600;font-size:17px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);animation:up 1.3s ease-out forwards;white-space:nowrap}
.fl.rk{color:var(--mint)}
@keyframes up{0%{opacity:0;transform:translate(-50%,-20%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-200%)}}
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:stretch;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
.chip{background:rgba(15,47,46,.9);border:1px solid rgba(126,240,196,.22);border-radius:18px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#cMoney{flex:1;min-width:0}
.lab{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.big{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
#cRank{width:128px}
.rk{display:flex;align-items:baseline;gap:4px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--amber)}
.rk small{font-size:12px;color:var(--mute);font-family:var(--body);font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin:4px 0 3px}
.bar i{display:block;height:100%;width:0;background:var(--mint);border-radius:4px;transition:width .3s}
#evt{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 92px);display:none;font-weight:800;font-size:13px;color:var(--amber);padding:6px 12px;border-radius:14px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 130px);transform:translate(-50%,-8px);background:rgba(251,247,236,.96);color:#12302e;font-weight:800;font-size:14px;padding:9px 16px;border-radius:16px;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);background:#0c2625}
#sheet{display:none;max-height:40vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--panel);border-radius:22px 22px 0 0;padding:12px 12px 6px}
#sheet.open{display:block}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.row:last-child{border-bottom:0}
.meta b{display:block;font-family:var(--display);font-weight:600;font-size:17px}
.meta span{display:block;font-size:13px;color:var(--mute);font-weight:700;line-height:1.3}
.btn{min-width:96px;min-height:44px;border:0;border-radius:14px;background:var(--mint);color:#0b2a27;font-family:var(--display);font-weight:700;font-size:16px;padding:0 14px;cursor:pointer;font-variant-numeric:tabular-nums}
.btn:active{transform:scale(.96)}
.btn.off{background:var(--panel-2);color:#78a79c;cursor:default}
.btn.lk{display:flex;align-items:center;justify-content:center;font-size:14px}
.btn.ghost{background:transparent;border:1px solid rgba(126,240,196,.4);color:var(--mint)}
.btn.danger{background:#e9695c;color:#fff}
.btn.sm{min-height:38px;font-size:14px;min-width:108px}
.btns{display:flex;flex-direction:column;gap:6px}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.stat{display:flex;justify-content:space-between;padding:7px 4px;font-size:14px;font-weight:700;color:var(--mute);border-bottom:1px solid rgba(255,255,255,.07)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--mute);font-weight:700;padding:8px 4px;line-height:1.4}
.h3{font-family:var(--display);font-weight:600;font-size:15px;color:var(--mint);padding:12px 4px 2px}
#selcard,#placebar{display:none;margin:0 10px 8px;padding:10px 12px;border-radius:18px;background:rgba(23,63,61,.98);border:1px solid rgba(126,240,196,.28)}
#selcard.show,#placebar.show{display:block}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc-top b{font-family:var(--display);font-weight:600;font-size:18px}
.sc-top span{font-size:13px;color:var(--mute);font-weight:700}
.sc-btns{display:flex;gap:8px;margin-top:8px}
.sc-btns .btn{flex:1;min-width:0;font-size:15px;padding:0 8px}
.x{width:36px;height:36px;min-width:36px;min-height:36px;border-radius:12px;border:0;background:var(--panel-2);color:var(--ink);font-size:18px;cursor:pointer}
#tabs{display:flex;gap:4px;padding:6px 6px 8px}
.tab{flex:1;min-width:0;min-height:46px;border:0;border-radius:14px;background:transparent;color:var(--mute);font-family:var(--display);font-weight:600;font-size:13px;padding:0 2px;cursor:pointer}
.tab.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--mint)}
.tab.pulse{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{background:#6b3b35;color:#ffd7cf}}
@media (prefers-reduced-motion:reduce){.tab.pulse{animation:none;color:var(--amber)}.fl{animation-duration:2s}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="fl"></div>
  <div id="hud">
    <div class="chip" id="cMoney">
      <div class="lab">Caisse du magasin</div>
      <div class="big" id="money">¥ 0</div>
      <div class="sub" id="rate">0 ¥ / min</div>
    </div>
    <div class="chip" id="cRank">
      <div class="rk"><span>★</span><span id="rankN">1</span><small id="clock">08:00</small></div>
      <div class="bar"><i id="rankBar"></i></div>
      <div class="sub" id="rankTxt">0 clients</div>
    </div>
  </div>
  <div class="chip" id="evt"></div>
  <div id="toast" role="status"></div>
  <div id="dock">
    <div id="selcard"></div>
    <div id="placebar"></div>
    <div id="sheet"></div>
    <nav id="tabs" aria-label="Menu du magasin">
      <button class="tab" data-tab="build" id="tabBuild">Construire</button>
      <button class="tab" data-tab="stock" id="tabStock">Stock</button>
      <button class="tab" data-tab="ups">Améliorer</button>
      <button class="tab" data-tab="staff">Équipe</button>
      <button class="tab" data-tab="gacha">Gacha</button>
      <button class="tab" data-tab="shop">Magasin</button>
    </nav>
  </div>
</div>
<noscript>Ce jeu a besoin de JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Sons : tout est synthétisé (Web Audio), aucun fichier ---------- */
var Snd=(function(){
  var ctx=null,fx=null,mus=null,musLP=null,comp=null,noiseBuf=null,sfxOn=true,musOn=true,last={},timer=null,step=0,nextT=0,night=0;
  try{var sv=JSON.parse(localStorage.getItem('konbini-hoshi-audio')||'{}');if(sv.s===false)sfxOn=false;if(sv.m===false)musOn=false;}catch(e){}
  function persist(){try{localStorage.setItem('konbini-hoshi-audio',JSON.stringify({s:sfxOn,m:musOn}));}catch(e){}}
  function init(){
    if(ctx){if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}return;}
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    try{ctx=new AC();}catch(e){ctx=null;return;}
    try{
      comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination);
      fx=ctx.createGain();fx.gain.value=0.6;fx.connect(comp);
      mus=ctx.createGain();mus.gain.value=0.17;musLP=ctx.createBiquadFilter();musLP.type='lowpass';musLP.frequency.value=2000;
      mus.connect(musLP);musLP.connect(comp);
      var n=Math.floor(ctx.sampleRate*1.5);noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate);var a=noiseBuf.getChannelData(0);for(var i=0;i<n;i++)a[i]=Math.random()*2-1;
      startMusic();
    }catch(e){ctx=null;}
  }
  function ok(name,ms){var n=Date.now();if(last[name]&&n-last[name]<ms)return false;last[name]=n;return true;}
  function tone(f,d,type,v,delay,f2){
    if(!ctx)return;var t=ctx.currentTime+(delay||0);
    var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v||0.2),t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(fx);o.start(t);o.stop(t+d+0.03);
  }
  function bell(f,d,v,delay){tone(f,d,'sine',v,delay);tone(f*2.01,d*0.6,'sine',v*0.35,delay);tone(f*3.99,d*0.3,'sine',v*0.12,delay);}
  function noise(d,v,delay,ftype,freq,q,f2){
    if(!ctx||!noiseBuf)return;var t=ctx.currentTime+(delay||0);
    var s=ctx.createBufferSource();s.buffer=noiseBuf;
    var f=ctx.createBiquadFilter();f.type=ftype||'lowpass';f.frequency.setValueAtTime(freq||1000,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+d);f.Q.value=q||1;
    var g=ctx.createGain();g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(fx);s.start(t,Math.random()*0.5,d+0.02);
  }
  function arp(notes,gap,type,v,d){notes.forEach(function(f,i){tone(f,d||0.18,type||'triangle',v||0.2,i*gap);});}
  var R=function(x){return x*(1+(Math.random()-0.5)*0.05);};

  var LIB={
    tap:function(){tone(740,0.05,'triangle',0.18);tone(1100,0.04,'triangle',0.1,0.025);},
    sel:function(){tone(520,0.05,'sine',0.14);},
    place:function(){tone(150,0.16,'sine',0.7,0,55);noise(0.08,0.25,0,'lowpass',900);bell(784,0.35,0.12,0.07);},
    rot:function(){tone(520,0.03,'square',0.08);tone(780,0.03,'square',0.08,0.045);},
    sell:function(){arp([1175,988,784,622],0.06,'square',0.07,0.1);},
    up:function(){arp([523,659,784,1047],0.07,'triangle',0.2,0.2);bell(1568,0.4,0.08,0.28);},
    buy:function(){tone(659,0.1,'square',0.09);tone(880,0.16,'square',0.09,0.09);bell(1760,0.35,0.08,0.18);},
    fill:function(){noise(0.3,0.18,0,'bandpass',400,1.2,2200);tone(420,0.08,'sine',0.2,0.28,700);},
    order:function(){tone(880,0.07,'square',0.08);tone(880,0.07,'square',0.08,0.11);tone(1175,0.12,'square',0.08,0.22);},
    truck:function(){tone(196,0.4,'sawtooth',0.1);tone(247,0.4,'sawtooth',0.1);tone(196,0.4,'sawtooth',0.1,0.55);tone(247,0.4,'sawtooth',0.1,0.55);},
    deliver:function(){tone(110,0.12,'sine',0.6,0,60);tone(110,0.12,'sine',0.6,0.2,60);noise(0.1,0.2,0,'lowpass',600);bell(988,0.4,0.14,0.34);},
    coin:function(){var k=R(1);tone(1319*k,0.07,'square',0.07);tone(1760*k,0.28,'square',0.06,0.065);noise(0.03,0.08,0,'highpass',5000);},
    beep:function(){tone(2200,0.06,'square',0.05);},
    warn:function(){tone(330,0.14,'square',0.1);tone(247,0.2,'square',0.1,0.17);},
    fanfare:function(){arp([523,659,784,1047],0.1,'triangle',0.22,0.35);tone(523,0.8,'triangle',0.15,0.42);tone(659,0.8,'triangle',0.15,0.42);tone(784,0.8,'triangle',0.15,0.42);tone(1047,0.9,'triangle',0.15,0.42);bell(2093,0.6,0.08,0.45);},
    event:function(){bell(880,0.4,0.18,0);bell(1175,0.5,0.18,0.15);},
    gachaCrank:function(){for(var i=0;i<9;i++){tone(900+i*30,0.03,'square',0.07,i*0.1);noise(0.02,0.1,i*0.1,'highpass',3000);}tone(180,0.14,'sine',0.5,1.0,70);},
    gachaWin:function(){arp([1047,1319,1568,2093,2637],0.07,'sine',0.18,0.4);bell(2093,0.8,0.12,0.4);},
    /* machines */
    vending:function(){tone(180,0.12,'square',0.22,0,80);noise(0.15,0.2,0.05,'lowpass',700);noise(0.1,0.15,0.6,'bandpass',1200,2);tone(160,0.1,'sine',0.4,0.62,70);},
    gacha:function(){for(var i=0;i<5;i++)tone(900+i*40,0.03,'square',0.06,i*0.08);tone(200,0.12,'sine',0.4,0.5,80);bell(1568,0.3,0.1,0.55);},
    atm:function(){tone(1500,0.06,'square',0.06);tone(1500,0.06,'square',0.06,0.12);tone(1900,0.1,'square',0.06,0.24);noise(0.8,0.13,0.4,'bandpass',500,2,1300);bell(1760,0.3,0.1,1.25);},
    tickets:function(){for(var i=0;i<6;i++)noise(0.04,0.15,0.35+i*0.07,'bandpass',2500,3);tone(1200,0.08,'square',0.06,0.1);tone(1600,0.1,'square',0.06,0.8);},
    copier:function(){noise(0.9,0.12,0,'bandpass',300,3,1500);tone(120,0.9,'sawtooth',0.04);noise(0.08,0.2,1,'lowpass',500);},
    parcel:function(){tone(420,0.05,'square',0.1);tone(1200,0.08,'square',0.07,0.15);tone(1500,0.1,'square',0.07,0.3);noise(0.08,0.15,0.5,'lowpass',500);},
    photo:function(){tone(1000,0.06,'square',0.07);tone(1000,0.06,'square',0.07,0.3);tone(1000,0.06,'square',0.07,0.6);noise(0.06,0.3,0.95,'highpass',2000);tone(200,0.06,'square',0.2,0.95);tone(1500,0.15,'square',0.05,1.2);},
    crane:function(){tone(120,1.1,'sawtooth',0.04,0.1,160);arp([784,988,1175,988,1319],0.07,'square',0.05,0.08);bell(1568,0.4,0.1,1.5);},
    massage:function(){tone(70,1.4,'sine',0.35,0,90);tone(75,1.4,'sine',0.25,0,60);noise(1.2,0.04,0,'lowpass',200);},
    arcade:function(){var n=[523,659,784,880,1047,784,1175];n.forEach(function(f,i){tone(f,0.06,'square',0.06,i*0.075);});tone(80,0.2,'square',0.1,0.6);},
    drone:function(){tone(220,1.3,'sawtooth',0.05,0,320);tone(224,1.3,'sawtooth',0.05,0,326);},
    printer3d:function(){for(var i=0;i<8;i++)tone(300+(i%3)*80,0.05,'square',0.05,i*0.09);},
    coffee:function(){noise(0.9,0.1,0.1,'lowpass',500);tone(900,0.08,'sine',0.1,0.05);bell(1319,0.3,0.08,0.95);},
    fries:function(){noise(0.9,0.14,0,'highpass',3500);noise(0.5,0.1,0.2,'highpass',6000);},
    smoothie:function(){tone(140,1.1,'sawtooth',0.07,0,220);noise(1.1,0.1,0,'lowpass',900);},
    oven:function(){bell(1568,0.35,0.14,0.15);bell(1568,0.35,0.14,0.45);},
    karaoke:function(){[523,659,784,659].forEach(function(f,i){tone(f,0.3,'sine',0.14,i*0.28);tone(f*1.005,0.3,'sine',0.1,i*0.28);});},
    vr:function(){noise(0.8,0.14,0,'bandpass',300,2,3000);tone(300,0.8,'sine',0.1,0,900);bell(1568,0.4,0.08,0.7);},
    robotbar:function(){for(var i=0;i<5;i++)tone(600+(i%2)*300,0.06,'square',0.05,i*0.12);noise(0.4,0.1,0.65,'bandpass',900,2);},
    portal:function(){noise(1.4,0.16,0,'bandpass',200,3,2400);tone(110,1.4,'sawtooth',0.07,0,440);arp([392,523,659,784,1047,1319],0.12,'sine',0.1,0.5);},
    kiosk:function(){tone(1400,0.06,'square',0.06);tone(1800,0.1,'square',0.06,0.1);},
    cards:function(){noise(0.1,0.2,0,'highpass',3000);noise(0.1,0.2,0.12,'highpass',3500);bell(1319,0.3,0.1,0.25);},
    pick:function(){tone(520*R(1),0.06,'sine',0.1,0,330);}
  };
  var THR={tap:60,sel:80,coin:90,door:900,beep:120,pick:150,warn:1500,place:80};
  function play(name){
    if(!sfxOn||!ctx||ctx.state==='suspended')return;
    var fn=LIB[name];if(!fn)return;
    if(!ok(name,THR[name]||250))return;
    try{fn();}catch(e){}
  }
  function machine(type){play(LIB[type]?type:'pick');}

  /* ----- musique d'ambiance douce (6 morceaux qui alternent) ----- */
  function mf(m){return 440*Math.pow(2,(m-69)/12);}
  var TR=[
    {bpm:72,ch:[[60,64,67,71],[57,60,64,67],[62,65,69,72],[55,59,62,65]],bs:[36,33,38,31],od:[0,1,2,3,2,1,3,2],sc:[72,74,76,79,81],hat:1},
    {bpm:64,ch:[[65,69,72,76],[64,67,71,74],[62,65,69,72],[60,64,67,71]],bs:[41,40,38,36],od:[0,2,1,3,2,3,1,2],sc:[77,79,81,84,86],hat:0},
    {bpm:78,ch:[[57,60,64,71],[53,57,60,64],[60,64,67,71],[55,59,62,66]],bs:[33,29,36,31],od:[0,1,2,3,3,2,1,0],sc:[69,72,74,76,79],hat:1},
    {bpm:84,ch:[[62,66,69,73],[59,62,66,69],[67,71,74,78],[57,61,64,67]],bs:[38,35,31,33],od:[0,2,1,3,0,2,3,1],sc:[74,76,78,81,83],hat:1},
    {bpm:68,ch:[[62,65,69,72],[55,59,62,65],[60,64,67,71],[57,60,64,67]],bs:[38,31,36,33],od:[0,1,2,3,2,1,2,3],sc:[72,74,76,79,81],hat:1},
    {bpm:60,ch:[[63,67,70,74],[60,63,67,70],[68,72,75,79],[58,62,65,68]],bs:[39,36,32,34],od:[0,3,1,2,3,2,1,0],sc:[75,77,79,82,84],hat:0}
  ];
  var tk=0,loops=0;
  function ep(f,t,d,v){
    [1,2].forEach(function(m,k){
      var o=ctx.createOscillator(),g=ctx.createGain();o.type=k?'sine':'triangle';o.frequency.value=f*m;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime((v||0.12)*(k?0.3:1),t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(mus);o.start(t);o.stop(t+d+0.05);
    });
  }
  function bassNote(f,t,d){
    var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.28,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(mus);o.start(t);o.stop(t+d+0.05);
  }
  function hat(t,v){
    var s=ctx.createBufferSource();s.buffer=noiseBuf;var f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
    var g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);

}
function trafficMult(){
  var m=1+upSum('traffic');
  ofType('plant').forEach(function(p){m+=CAT.plant.traffic*decorF(p.l);});
  ofType('neko').forEach(function(p){m+=CAT.neko.traffic*decorF(p.l);});
  ['aquarium','sakura'].forEach(function(t){ofType(t).forEach(function(p){m+=CAT[t].traffic*decorF(p.l);});});

/* ---------- Grille et chemins ---------- */
function rebuildOcc(){
  occ=[];for(var x=0;x<W;x++){occ.push(new Array(D).fill(null));}
  S.items.forEach(function(it){if(!it.held&&it.x<W&&it.z<D)occ[it.x][it.z]=it;});
  updateGlow();
}
function bfs(sx,sz,tx,tz){
  if(sx===tx&&sz===tz)return [[sx,sz]];
  var prev={},start=sx*64+sz,goal=tx*64+tz,qu=[[sx,sz]];prev[start]=-1;
  while(qu.length){
    var cur=qu.shift();
    for(var k=0;k<4;k++){
      var nx=cur[0]+DIRS[k][0],nz=cur[1]+DIRS[k][1];
      if(nx<0||nz<0||nx>=W||nz>=D)continue;
      var key=nx*64+nz;
      if(prev[key]!==undefined)continue;
      if(occ[nx][nz])continue;
      prev[key]=cur[0]*64+cur[1];
      if(key===goal){
        var path=[],c=key;
        while(c!==-1){path.push([Math.floor(c/64),c%64]);c=prev[c];}
        return path.reverse();
      }
      qu.push([nx,nz]);
    }
  }
  return null;
}
function floodFrom(sx,sz){
  var seen={},qu=[[sx,sz]];seen[sx*64+sz]=1;
  while(qu.length){
    var cur=qu.shift();
    for(var k=0;k<4;k++){
      var nx=cur[0]+DIRS[k][0],nz=cur[1]+DIRS[k][1];
      if(nx<0||nz<0||nx>=W||nz>=D)continue;
      var key=nx*64+nz;
      if(seen[key]||occ[nx][nz])continue;
      seen[key]=1;qu.push([nx,nz]);
    }
  }
  return seen;
}
function layoutOK(extra){
  if(occ[DOORX][D-1])return false;
  var seen=floodFrom(DOORX,D-1);
  var list=live().concat(extra?[extra]:[]);
  for(var i=0;i<list.length;i++){
    var it=list[i];if(!needsAccess(it.type))continue;
    var f=frontOf(it);
    if(f.cx<0||f.cz<0||f.cx>=W||f.cz>=D||occ[f.cx][f.cz]||!seen[f.cx*64+f.cz])return false;
  }
  return true;
}
function cellStatus(x,z){
  if(x<0||z<0||x>=W||z>=D)return 'out';
  if(occ[x][z])return 'occ';
  if(x===DOORX&&z===D-1)return 'door';
  var t=placing?placing.type:'snack',tmp={x:x,z:z,type:t,held:false,r:placing?placing.r:0};
  if(needsAccess(t)){
    var f=frontOf(tmp);
    if(f.cx<0||f.cz<0||f.cx>=W||f.cz>=D||occ[f.cx][f.cz])return 'front';
  }
  occ[x][z]=tmp;
  var ok=layoutOK(tmp);
  occ[x][z]=null;
  return ok?'ok':'block';
}
function cellOf(c){return [clamp(Math.floor(c.g.position.x),0,W-1),clamp(Math.floor(c.g.position.z),0,D-1)];}
function adjacentSpot(it){
  var f=frontOf(it);
  if(f.cx<0||f.cz<0||f.cx>=W||f.cz>=D||occ[f.cx][f.cz])return null;
  return [f.cx,f.cz];
}
function regFront(r){
  var f=frontOf(r);
  if(f.cx<0||f.cz<0||f.cx>=W||f.cz>=D||occ[f.cx][f.cz])return null;
  return f;
}

/* ---------- Acteurs (clients et employés) ---------- */
function setPath(c,cx,cz,extra){
  var cc=cellOf(c),cells=bfs(cc[0],cc[1],cx,cz),pts=[];
  if(cells){
    for(var i=1;i<cells.length;i++)pts.push({x:cells[i][0]+0.5+c.jx,z:cells[i][1]+0.5+c.jz});
    if(cells.length===1)pts.push({x:cx+0.5+c.jx,z:cz+0.5+c.jz});
  }else{
    pts.push({x:cx+0.5,z:cz+0.5});
  }
  c.path=pts.concat(extra||[]);c.destCell=[cx,cz];c.extra=extra||[];c.state='walk';
}
function repathAll(){
  customers.concat(staffActors).forEach(function(c){
    if(c.state==='walk'&&c.destCell&&c.g.position.z<D-0.1){
      var cb=c.onArrive;setPath(c,c.destCell[0],c.destCell[1],c.extra);c.onArrive=cb;
    }
  });
}
function faceTo(c,dx,dz,dt){
  var a=Math.atan2(dx,dz),cur=c.g.rotation.y,d=a-cur;
  while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  c.g.rotation.y=cur+d*Math.min(1,dt*12);
}
function animActor(c,dt,moving){
  var u=c.g.userData;
  if(moving){c.phase+=dt*9;}
  var sw=moving?Math.sin(c.phase)*0.7:0;
  u.legL.rotation.x=u.legL.rotation.x*(moving?0:0.8)+sw*(moving?1:0);
  u.legR.rotation.x=u.legR.rotation.x*(moving?0:0.8)-sw*(moving?1:0);
  u.armL.rotation.x=-sw*0.8;u.armR.rotation.x=sw*0.8;
  var p=c.g.position;
  var gy=p.z<D+0.1?FLOOR_Y:0.06;
  p.y=gy+(moving?Math.abs(Math.sin(c.phase))*0.03:0);
}
function moveActor(c,dt){
  var p=c.g.position,moving=false;
  if(c.path.length){
    var t=c.path[0],dx=t.x-p.x,dz=t.z-p.z,d=Math.hypot(dx,dz),step=c.speed*(c.kind==='staff'?stkMult:1)*dt;
    if(d<=step){
      p.x=t.x;p.z=t.z;c.path.shift();
      if(!c.path.length){var cb=c.onArrive;c.onArrive=null;if(cb)cb();}else moving=true;
    }else{p.x+=dx/d*step;p.z+=dz/d*step;moving=true;faceTo(c,dx,dz,dt);}
  }
  return moving;
}
function updateActor(c,dt){
  var moving=false;
  if(c.state==='walk'){moving=moveActor(c,dt);}
  else if(c.state==='wait'){
    c.t-=dt;
    if(c.t<=0){c.state='walk';var f=c.after;c.after=null;if(f)f();}
  }
  if(c.state==='queue')moving=c.qMoving;
  animActor(c,dt,moving);
}
function removeActor(c){
  scene.remove(c.g);
  customers=customers.filter(function(x){return x!==c;});
  staffActors=staffActors.filter(function(x){return x!==c;});
}
function wait(c,t,after){c.state='wait';c.t=t;c.after=after;}
function faceItem(c,it){
  var dx=it.g.position.x-c.g.position.x,dz=it.g.position.z-c.g.position.z;
  if(dx||dz)c.g.rotation.y=Math.atan2(dx,dz);
}

/* clients */
function inStock(){return live().filter(function(i){return stocked(i)&&i.stock>0;});}
function pickBasket(){
  var pool=inStock();
  var k=1+(Math.random()<0.5?1:0)+(Math.random()<0.25?1:0);
  k=Math.min(k,pool.length);
  var out=[];
  for(var n=0;n<k;n++){
    var tot=0,ws=pool.map(function(i){var w=i.type==='atm'?0.5:i.type==='vending'?0.9:1;tot+=w;return w;});
    var r=Math.random()*tot,idx=0;
    for(var j=0;j<pool.length;j++){r-=ws[j];if(r<=0){idx=j;break;}}
    out.push(pool[idx]);pool.splice(idx,1);
  }
  return out;
}
function canServe(){

function startShopping(c){c.goals=pickBasket();nextGoal(c);}
function nextGoal(c){
  var it=c.goals.shift();
  if(!it){checkout(c);return;}
  if(it.held||S.items.indexOf(it)<0||it.stock<=0){nextGoal(c);return;}
  var sp=adjacentSpot(it);

function takeItem(c,it){
  if(S.items.indexOf(it)>=0&&!it.held&&it.stock>0){
    var price=itemPrice(it);
    it.stock--;it.pulse=1;it.useT=simTime;Snd.machine(CAT[it.type].kind==='direct'?it.type:'pick');

    if(it.stock===0&&simTime-emptyToast>6){emptyToast=simTime;Snd.play('warn');toast(CAT[it.type].n+' : rupture de stock !');}
    if(CAT[it.type].kind==='direct'){
      gain(price,it.g.position);countServed(c);
    }else{c.owed+=price;}
  }
  nextGoal(c);
}
function checkout(c){
  if(c.owed>0){
    var regs=ofKind('register').filter(function(r){return regFront(r);});
    if(regs.length){
      var best=null,bs=1e9;
      regs.forEach(function(r){var s=(r.q.length+(r.cur?0.5:0))*serviceTime(r);if(s<bs){bs=s;best=r;}});
      var f=regFront(best);
      setPath(c,f.cx,f.cz);
      c.onArrive=function(){
        if(S.items.indexOf(best)<0){checkout(c);return;}
        c.reg=best;c.state='queue';c.qMoving=false;best.q.push(c);
      };
      return;
    }
    c.owed=0;
  }
  afterPay(c);
}
function afterPay(c){

  if(tables.length&&Math.random()<0.3){
    var it=pick(tables),sp=adjacentSpot(it);
    if(sp){

}

/* ---------- Stock ---------- */
function fillItem(it,max){
  var take=Math.min(capOf(it)-it.stock,reserveOf(it.type),max||1e9);
  if(take<=0)return 0;
  S.reserve[it.type]=reserveOf(it.type)-take;
  it.stock+=take;syncVis(it);updateAlert(it);
  return take;
}
function fillAll(){
  var list=live().filter(function(i){return stocked(i)&&i.stock<capOf(i);});
  list.sort(function(a,b){return a.stock/capOf(a)-b.stock/capOf(b);});
  var tot=0;list.forEach(function(i){tot+=fillItem(i);});
  if(tot>0)Snd.play('fill');
  if(tot>0)toast(tot+' article'+(tot>1?'s':'')+' remis en rayon.');
  else toast('Rien à remplir : la réserve est vide ou les rayons sont pleins.');
  renderSheet();renderSel();save();
}
function orderStock(type,qty){
  var space=reserveCap()-reserveOf(type)-pendingQty(type);
  qty=Math.min(qty,space);
  if(qty<=0){toast('Réserve pleine pour ce produit.');return;}
  var cost=qty*unitCost(type);
  if(S.money<cost){toast('Pas assez de yens.');return;}
  S.money-=cost;S.pending.push({type:type,qty:qty});Snd.play('order');
  toast('Commande passée : le camion arrive.');
  renderSheet();save();
}
function deliver(){
  var tot=0;
  S.pending.forEach(function(p){S.reserve[p.type]=reserveOf(p.type)+p.qty;tot+=p.qty;});
  S.pending=[];truckDelivered=true;Snd.play('deliver');
  if(tot)toast('Livraison reçue : '+tot+' articles en réserve.');
  renderSheet();save();
}
function autoOrder(){
  if(!S.ups.autoorder)return;
  var types={};S.items.forEach(function(i){if(stocked(i))types[i.type]=1;});
  Object.keys(types).forEach(function(t){
    if(reserveOf(t)+pendingQty(t)>=25)return;
    var qty=Math.min(40,reserveCap()-reserveOf(t));
    var cost=qty*unitCost(t);
    if(qty>0&&S.money>cost*3){S.money-=cost;S.reserve[t]=reserveOf(t)+qty;}
  });
}

  pLights.forEach(function(pl){pl.intensity=1.2*n;});
  for(var mk in mcache){var mm=mcache[mk];if(mm.userData&&mm.userData.base)mm.emissiveIntensity=mm.userData.base*(0.75+0.6*n);}

function fitCamera(){

  baseHalf=Math.max(vh/2,vw/aspect/2);

function resize(){

  var a=w/h;
  camera.left=-baseHalf*a;camera.right=baseHalf*a;camera.top=baseHalf;camera.bottom=-baseHalf;

function placeCam(){

}
var rightV=new T.Vector3(1,0,-1).normalize(),fwdV=new T.Vector3(-1,0,-1).normalize();
function panBy(dx,dy){
  var wpp=(2*baseHalf/zoom)/innerHeight;
  camTarget.addScaledVector(rightV,-dx*wpp);
  camTarget.addScaledVector(fwdV,dy*wpp*1.73);
  camTarget.x=clamp(camTarget.x,-5,W+7);camTarget.z=clamp(camTarget.z,-5,D+9);
}

var toastT=null;

function floatAt(v,text,cls){
  camera.updateMatrixWorld();

  var d=document.createElement('div');d.className='fl '+(cls||'');d.textContent=text;
  d.style.left=((p.x+1)/2*innerWidth)+'px';d.style.top=((1-p.y)/2*innerHeight)+'px';

function nextUnlockNote(){
  var r=rank(),best=99;
  Object.keys(CAT).forEach(function(k){if(CAT[k].rank>r&&CAT[k].rank<best)best=CAT[k].rank;});
  UPS.forEach(function(u){if(u.rank>r&&u.rank<best)best=u.rank;});
  if(best===99)return '<div class="note">Tout est débloqué. Montez vos meubles au niveau maximum.</div>';
  return '<div class="note">Servez plus de clients pour atteindre le rang ★'+best+' et découvrir de nouveaux articles.</div>';

function updateHud(){

/* ---------- Actions ---------- */
function startPlace(type,moveItem){
  placing={type:type,move:moveItem||null,r:moveItem?moveItem.r:0};
  selected=null;tabOpen=null;
  renderSheet();renderSel();renderPlace();refreshHighlights();
}
function endPlace(){
  placing=null;refreshHighlights();renderPlace();renderSheet();renderSel();
}
function attemptPlace(x,z){
  var st=cellStatus(x,z);
  if(st==='out')return;
  if(st==='occ'){toast('Cette case est déjà prise.');return;}
  if(st==='door'){toast("Gardez l'entrée dégagée.");return;}
  if(st==='front'){toast('Le devant du meuble doit rester dégagé. Touchez Pivoter.');return;}
  if(st==='block'){toast('Cela bloquerait le passage des clients.');return;}
  var p=placing;
  if(p.move){
    var it=p.move;it.x=x;it.z=z;it.r=p.r;it.held=false;it.g.visible=true;it.g.position.set(x+0.5,FLOOR_Y,z+0.5);it.g.rotation.y=it.r*Math.PI/2;it.pop=1;Snd.play('place');
    rebuildOcc();repathAll();syncStaff();placing=null;
    refreshHighlights();renderPlace();renderSheet();save();
    return;
  }
  var cost=costOf(p.type);
  if(S.money<cost){toast('Pas assez de yens.');return;}
  S.money-=cost;Snd.play('place');
  addItem(p.type,x,z,1,cost,p.r);
  rebuildOcc();repathAll();syncStaff();
  refreshHighlights();renderPlace();save();
}
function rotatePlace(){
  if(!placing)return;
  placing.r=(placing.r+1)%4;Snd.play('rot');
  refreshHighlights();
}
function rotateSel(){
  var it=selected;if(!it)return;
  var old=it.r;it.r=(old+1)%4;rebuildOcc();
  if(needsAccess(it.type)&&!layoutOK(null)){
    it.r=old;rebuildOcc();toast('Le devant du meuble doit rester dégagé.');return;
  }
  it.g.rotation.y=it.r*Math.PI/2;it.pop=1;Snd.play('rot');
  repathAll();save();
}
function upgradeSel(){
  var it=selected;if(!it)return;
  if(it.l>=maxLevel()){toast('Niveau max pour ce rang.');return;}
  var cost=upCost(it);
  if(S.money<cost){toast('Pas assez de yens.');return;}
  S.money-=cost;it.spent+=cost;it.l++;Snd.play('up');
  it.vis=visN(it);rebuildModel(it);updateAlert(it);renderSel();save();
}
function fillSel(){
  var it=selected;if(!it)return;
  if(it.stock>=capOf(it)){toast('Ce meuble est déjà plein.');return;}
  var n=fillItem(it);
  if(n)Snd.play('fill');
  if(!n)toast('La réserve est vide. Commandez dans Stock.');
  renderSel();save();
}
function sellSel(){
  var it=selected;if(!it)return;
  S.money+=Math.round(it.spent*0.6);Snd.play('sell');
  selected=null;removeItem(it);repathAll();syncStaff();renderSel();renderSheet();save();
}
function moveSel(){
  var it=selected;if(!it)return;
  it.held=true;it.g.visible=false;
  var q=it.q;it.q=[];it.cur=null;
  rebuildOcc();
  startPlace(it.type,it);
  q.forEach(function(c){c.reg=null;checkout(c);});
}
function cancelMove(){
  var it=placing.move;it.held=false;it.g.visible=true;rebuildOcc();
  placing=null;refreshHighlights();renderPlace();renderSheet();
}
function expand(){
  var nt=TIERS[S.tier+1];if(!nt)return;
  if(rank()<nt.rank){toast('Rang ★'+nt.rank+' requis.');return;}
  if(S.money<nt.cost){toast('Pas assez de yens.');return;}
  S.money-=nt.cost;Snd.play('fanfare');S.tier++;W=nt.w;D=nt.d;
  customers.slice().forEach(removeActor);
  S.items.forEach(function(it){it.q=[];it.cur=null;});
  rebuildOcc();buildShell();fitCamera();
  staffActors.slice().forEach(removeActor);syncStaff();
  toast('Le magasin est agrandi : '+W+' × '+D+' cases.');
  renderSheet();save();
}
function handleAct(b){
  var a=b.getAttribute('data-act');
  if(a==='build'){
    var t=b.getAttribute('data-type'),cost=costOf(t);
    if(S.money<cost){toast('Pas assez de yens.');return;}
    startPlace(t);
  }else if(a==='up'){
    var u=UPS.filter(function(x){return x.id===b.getAttribute('data-id');})[0];
    if(S.money<u.cost){toast('Pas assez de yens.');return;}
    S.money-=u.cost;S.ups[u.id]=true;toast(u.n+' : '+u.d);renderSheet();save();
  }else if(a==='hire'){
    var role=b.getAttribute('data-role'),cost2=Number(b.getAttribute('data-cost'));
    if(S.money<cost2){toast('Pas assez de yens.');return;}
    if(role==='cashier'&&S.staff.cashier>=ofKind('register').filter(function(r){return !CAT[r.type].auto;}).length){toast('Ajoutez une caisse pour embaucher un autre caissier.');return;}
    S.money-=cost2;S.staff[role]++;syncStaff();renderSheet();save();
  }else if(a==='order'){orderStock(b.getAttribute('data-type'),Number(b.getAttribute('data-qty')));}
  else if(a==='gacha'){pullGacha();}
  else if(a==='sfx'){Snd.toggleSfx();renderSheet();}
  else if(a==='music'){Snd.toggleMusic();renderSheet();}
  else if(a==='export'){doExport();}
  else if(a==='import'){doImport();}
  else if(a==='fillall'){fillAll();}
  else if(a==='fillsel'){fillSel();}
  else if(a==='rotsel'){rotateSel();}
  else if(a==='rotplace'){rotatePlace();}
  else if(a==='expand'){expand();}
  else if(a==='upg'){upgradeSel();}
  else if(a==='sell'){sellSel();}
  else if(a==='move'){moveSel();}
  else if(a==='desel'){selected=null;renderSel();}
  else if(a==='donePlace'){endPlace();}
  else if(a==='cancelmove'){cancelMove();}
  else if(a==='reset'){
    if(b.getAttribute('data-armed')){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}
    else{b.setAttribute('data-armed','1');b.textContent='Confirmer';setTimeout(function(){b.removeAttribute('data-armed');b.textContent='Effacer';},3000);}
  }
}
document.addEventListener('click',function(e){
  var el=e.target;
  while(el&&el!==document){
    if(el.getAttribute&&el.getAttribute('data-act')){handleAct(el);return;}
    if(el.classList&&el.classList.contains('tab')){
      var t=el.getAttribute('data-tab');
      if(placing)return;
      tabOpen=(tabOpen===t)?null:t;selected=null;renderSel();renderSheet();
      $('tabBuild').classList.remove('pulse');
      return;
    }
    el=el.parentNode;
  }
});

/* ---------- Entrées tactiles ---------- */
var raycaster=new T.Raycaster(),ndc=new T.Vector2(),plane=new T.Plane(new T.Vector3(0,1,0),-FLOOR_Y),hit=new T.Vector3();
function setNdc(px,py){ndc.set(px/innerWidth*2-1,-(py/innerHeight)*2+1);raycaster.setFromCamera(ndc,camera);}
function onTap(px,py){
  setNdc(px,py);
  if(placing){
    if(raycaster.ray.intersectPlane(plane,hit))attemptPlace(Math.floor(hit.x),Math.floor(hit.z));
    return;
  }
  if(raycaster.intersectObject(gachaRoot,true).length){selected=null;tabOpen='gacha';renderSel();renderSheet();return;}
  var hits=raycaster.intersectObjects(itemRoots,true);
  for(var i=0;i<hits.length;i++){
    var o=hits[i].object;
    while(o&&!(o.userData&&o.userData.item))o=o.parent;
    if(o){selected=o.userData.item;tabOpen=null;renderSheet();renderSel();return;}
  }
  selected=null;tabOpen=null;renderSel();renderSheet();
}
var ptrs={},tapInfo=null,pinchD=0;
canvas.addEventListener('pointerdown',function(e){
  canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===1)tapInfo={x:e.clientX,y:e.clientY,moved:false};
  else{tapInfo=null;var a=ptrs[ids[0]],b=ptrs[ids[1]];pinchD=Math.hypot(a.x-b.x,a.y-b.y);}
});
canvas.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;
  var ids=Object.keys(ptrs);
  if(ids.length===1){
    var dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(tapInfo&&!tapInfo.moved&&Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>8)tapInfo.moved=true;
    if(tapInfo&&tapInfo.moved)panBy(dx,dy);
    p.x=e.clientX;p.y=e.clientY;
  }else if(ids.length>=2){
    p.x=e.clientX;p.y=e.clientY;
    var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD>0)setZoom(zoom*d/pinchD);
    pinchD=d;
  }
});
function endPtr(e){
  var had=ptrs[e.pointerId];
  delete ptrs[e.pointerId];
  if(had&&tapInfo&&!tapInfo.moved&&Object.keys(ptrs).length===0&&e.type==='pointerup')onTap(e.clientX,e.clientY);
  if(Object.keys(ptrs).length===0)tapInfo=null;
  pinchD=0;
}
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',function(e){e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:0.91));},{passive:false});

/* ---------- Sauvegarde ---------- */
function buildSave(){
  var res={};Object.keys(S.reserve).forEach(function(k){res[k]=S.reserve[k];});
  S.pending.forEach(function(p){res[p.type]=(res[p.type]||0)+p.qty;});
  return {v:1,money:S.money,served:S.served,earned:S.earned,tier:S.tier,clock:S.clock,ups:S.ups,staff:S.staff,avgRate:S.avgRate,reserve:res,g:S.gacha,t:Date.now(),
    items:S.items.map(function(i){return {t:i.type,x:i.x,z:i.z,l:i.l,s:i.spent,r:i.r,k:i.stock};})};
}
var remote={ref:null,state:'none',dirty:false,busy:false,last:0};
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(buildSave()));}catch(e){}
  remote.dirty=true;
}
function pushRemote(force){
  if(!remote.ref||remote.busy||!remote.dirty)return;
  if(!force&&Date.now()-remote.last<15000)return;
  remote.busy=true;remote.dirty=false;remote.last=Date.now();
  var p;
  try{p=remote.ref.set({d:JSON.stringify(buildSave())});}catch(e){remote.busy=false;remote.dirty=true;remote.state='err';return;}
  p.then(function(){remote.busy=false;remote.state='ok';}).catch(function(){remote.busy=false;remote.dirty=true;remote.state='err';});
}
function applySave(d){
  selected=null;placing=null;
  customers.slice().forEach(removeActor);
  staffActors.slice().forEach(removeActor);
  S.items.slice().forEach(function(it){scene.remove(it.g);});
  S.items=[];itemRoots=[];
  S.money=d.money;S.served=d.served;S.earned=d.earned;S.tier=Math.min(d.tier,TIERS.length-1);S.clock=d.clock;S.ups=d.ups||{};S.staff=d.staff||{cashier:0,stocker:0};S.avgRate=d.avgRate||0;
  S.reserve=d.reserve||{};S.pending=[];S.gacha=d.g&&d.g.got?d.g:{n:0,got:{}};stkMult=1+upSum('stk');
  W=TIERS[S.tier].w;D=TIERS[S.tier].d;
  buildShell();
  (d.items||[]).forEach(function(i){if(CAT[i.t]&&i.x<W&&i.z<D)addItem(i.t,i.x,i.z,i.l,i.s,i.r||0,i.k);});
  rebuildOcc();
  var away=Math.min((Date.now()-d.t)/1000,6*3600);
  if(away>60&&S.avgRate>0){
    var g=Math.round(S.avgRate*away*0.5);
    if(g>0){S.money+=g;S.earned+=g;setTimeout(function(){toast('Pendant votre absence : +'+yen(g));},700);}
  }
}
function refreshAll(){
  S.items.forEach(function(i){i.pop=0;});
  syncStaff();fitCamera();applyTime();updateHud();renderSel();renderSheet();
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);if(!raw)return false;
    var d=JSON.parse(raw);if(!d||d.v!==1)return false;
    applySave(d);
    return true;
  }catch(e){return false;}
}
function initRemote(){
  if(!window.claude||!window.claude.use)return;
  var db=null;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    db=r[0];var us=r[1];if(!db||!us)return null;
    return us.id();
  }).then(function(id){
    if(!id||!db)return null;
    var ref=db.collection('data/users/'+id).doc('konbini');
    return ref.get().then(function(snap){return {ref:ref,snap:snap};});
  }).then(function(o){
    if(!o)return;
    var d=null;
    try{if(o.snap.exists){d=JSON.parse(o.snap.data().d);}}catch(e){d=null;}
    if(d&&d.v===1&&d.earned>S.earned){
      applySave(d);refreshAll();save();toast('Partie en ligne restaurée.');
    }
    remote.ref=o.ref;remote.state='ok';remote.dirty=true;pushRemote(true);
    renderSheet();
  }).catch(function(){remote.state='err';});
}
var saveText='';
function doExport(){
  try{saveText=btoa(JSON.stringify(buildSave()));}catch(e){saveText='';}
  try{if(navigator.clipboard&&saveText)navigator.clipboard.writeText(saveText).then(function(){toast('Code copié.');},function(){});}catch(e){}
  renderSheet();
}
function doImport(){
  var el=document.getElementById('saveIn');var v=el?el.value.trim():'';
  try{
    var d=JSON.parse(atob(v));
    if(!d||d.v!==1||!d.items)throw new Error('x');
    applySave(d);refreshAll();save();pushRemote(true);toast('Partie importée.');
  }catch(e){toast('Code invalide.');}
}

function offlineCredit(sec){
  sec=Math.min(sec,6*3600);
  var g=Math.round(S.avgRate*sec*0.5);
  if(g>0){S.money+=g;S.earned+=g;toast('Pendant votre absence : +'+yen(g));}
  S.clock=(S.clock+sec*4)%1440;
}

/* ---------- Boucle ---------- */
var last=performance.now(),accHud=0,accSave=0,accSec=0,accTime=0;
function update(dt){
  simTime+=dt;
  S.clock=(S.clock+dt*4)%1440;
  accTime+=dt;if(accTime>0.5){accTime=0;applyTime();}
  /* événements */
  if(S.evt){S.evt.left-=dt;if(S.evt.left<=0){S.evt=null;evTimer=rnd(140,260);}}
  else{evTimer-=dt;if(evTimer<=0){var e=pick(EVENTS);S.evt={n:e.n,t:e.t,s:e.s,left:e.dur};Snd.play('event');toast(e.n+' !');}}
  /* arrivées */
  if(canServe()&&customers.length<maxCust()){
    spawnAcc+=dt*0.17*trafficMult()*hourMult();
    if(spawnAcc>=1){spawnAcc=Math.min(spawnAcc-1,1);spawnCustomer();}
  }
  /* commandes automatiques */
  autoAcc+=dt;if(autoAcc>4){autoAcc=0;autoOrder();}
  /* acteurs */
  var i;
  for(i=customers.length-1;i>=0;i--)if(customers[i])updateActor(customers[i],dt);
  for(i=staffActors.length-1;i>=0;i--)if(staffActors[i])updateActor(staffActors[i],dt);
  /* caisses */
  S.items.forEach(function(r){
    if(CAT[r.type].kind!=='register'||r.held)return;
    var f=regFront(r);
    r.q=r.q.filter(function(c){return customers.indexOf(c)>=0;});
    if(r.cur&&r.q.indexOf(r.cur)<0)r.cur=null;
    if(!f)return;
    var fx=f.cx+0.5,fz=f.cz+0.5;
    r.q.forEach(function(c,k){
      var sx=fx+f.dx*k*0.42,sz=fz+f.dz*k*0.42,p=c.g.position;
      var dx=sx-p.x,dz=sz-p.z,d=Math.hypot(dx,dz),st=2.2*dt;
      if(d>0.02){var m=Math.min(1,st/d);p.x+=dx*m;p.z+=dz*m;c.qMoving=d>0.05;}
      else c.qMoving=false;
      c.g.rotation.y=Math.atan2(-f.dx,-f.dz);
    });
    if(!r.cur&&r.q.length){
      var c0=r.q[0],p0=c0.g.position;
      if(Math.hypot(fx-p0.x,fz-p0.z)<0.2){r.cur=c0;r.timer=serviceTime(r);Snd.play('beep');}
    }
    if(r.cur){
      r.timer-=dt;
      if(r.timer<=0){
        var c=r.cur;r.cur=null;r.q.shift();
        gain(c.owed,r.g.position);c.owed=0;countServed(c);
        r.pop=Math.max(r.pop,0.6);
        afterPay(c);
      }
    }
  });
  /* animations de meubles */
  S.items.forEach(function(it){
    if(it.pop>0){it.pop=Math.max(0,it.pop-dt*3);var s=1+0.16*Math.sin(it.pop*Math.PI);it.g.scale.set(s,s,s);}
    else if(it.pulse>0){it.pulse=Math.max(0,it.pulse-dt*4);var s2=1+0.05*Math.sin(it.pulse*Math.PI);it.g.scale.set(s2,s2,s2);}
    var tk=it.model&&it.model.userData.tick;if(tk)tk(simTime,dt,it);
    if(it.alert&&it.alert.visible)it.alert.position.y=1.95+Math.sin(simTime*5)*0.05;
  });
  var gt=gachaModel.userData.tick;if(gt)gt(simTime,dt,gachaObj);
  gachaHint.visible=!gachaBusy&&S.money>=gachaPrice()&&Object.keys(S.gacha.got).length<GACHA.length;gachaHint.position.y=1.55+Math.sin(simTime*3)*0.08;gachaHint.rotation.y=simTime*2;
  /* camion de livraison */
  if(!truck.visible){
    if(S.pending.length){truckTimer-=dt;if(truckTimer<=0){truck.visible=true;truckX=-12;Snd.play('truck');truckDelivered=false;}}
  }else{
    truckX+=dt*3.2;truck.position.set(truckX,0.04,D+4.7);
    if(!truckDelivered&&truckX>=DOORX+0.5)deliver();
    if(truckX>W+16){truck.visible=false;truckTimer=1.5;}
  }
  /* statistiques */
  accSec+=dt;
  if(accSec>=1){accSec-=1;S.avgRate=S.avgRate*0.9+secEarn*0.1;secEarn=0;}
  accHud+=dt;if(accHud>0.25){accHud=0;updateHud();}
  accSave+=dt;if(accSave>12){accSave=0;save();}pushRemote(false);
}
function frame(now){
  requestAnimationFrame(frame);
  var dtr=(now-last)/1000;last=now;
  if(dtr>15){offlineCredit(dtr);dtr=0.05;}else dtr=Math.min(dtr,0.1);
  update(dtr);
  placeCam();
  renderer.render(scene,camera);
}
document.addEventListener('visibilitychange',function(){if(document.hidden){save();pushRemote(true);}});
window.addEventListener('pagehide',function(){save();pushRemote(true);});
window.addEventListener('resize',function(){fitCamera();});

/* ---------- Démarrage ---------- */
var loaded=load();
if(!loaded){
  buildShell();
  addItem('register',4,1,1,0,0);
  addItem('snack',1,0,1,0,0);
  rebuildOcc();
  toast('Bienvenue ! Construisez des rayons. Quand un rayon se vide, touchez-le puis Remplir, et commandez du stock.');
  $('tabBuild').classList.add('pulse');
}
S.items.forEach(function(i){i.pop=0;});
syncStaff();
fitCamera();applyTime();updateHud();renderSheet();
initRemote();
requestAnimationFrame(frame);
})();
</script>
