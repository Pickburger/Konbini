<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Konbini Hoshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Mise en page : scène 3D plein écran, bandeau d'état en haut, tiroir d'actions en bas */
  --bg:#0f2f2e;
  --panel:#173f3d;
  --panel-2:#215450;
  --ink:#fbf7ec;
  --mint:#7ef0c4;
  --amber:#ffb347;
  --mute:#a4cdc2;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;background:#8fd3f4}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:600;font-size:17px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);animation:up 1.3s ease-out forwards;white-space:nowrap}
.fl.rk{color:var(--mint)}
@keyframes up{0%{opacity:0;transform:translate(-50%,-20%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-200%)}}
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:stretch;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
.chip{background:rgba(15,47,46,.9);border:1px solid rgba(126,240,196,.22);border-radius:18px;padding:8px 12px;}
#cMoney{flex:1;min-width:0}
.lab{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.big{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
#cRank{width:128px}
.rk{display:flex;align-items:baseline;gap:4px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--amber)}
.rk small{text-align:right;line-height:1.15;font-size:12px;color:var(--mute);font-family:var(--body);font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin:4px 0 3px}
.bar i{display:block;height:100%;width:0;background:var(--mint);border-radius:4px;transition:width .3s}
#evt{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 92px);display:none;font-weight:800;font-size:13px;color:var(--amber);padding:6px 12px;border-radius:14px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 130px);transform:translate(-50%,-8px);background:rgba(251,247,236,.96);color:#12302e;font-weight:800;font-size:14px;padding:9px 16px;border-radius:16px;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);background:#0c2625}
#sheet{display:none;max-height:40vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--panel);border-radius:22px 22px 0 0;padding:12px 12px 6px}
#sheet.open{display:block}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.row:last-child{border-bottom:0}
.meta b{display:block;font-family:var(--display);font-weight:600;font-size:17px}
.meta span{display:block;font-size:13px;color:var(--mute);font-weight:700;line-height:1.3}
.btn{min-width:96px;min-height:44px;border:0;border-radius:14px;background:var(--mint);color:#0b2a27;font-family:var(--display);font-weight:700;font-size:16px;padding:0 14px;cursor:pointer;font-variant-numeric:tabular-nums}
.btn:active{transform:scale(.96)}
.btn.off{background:var(--panel-2);color:#78a79c;cursor:default}
.btn.lk{display:flex;align-items:center;justify-content:center;font-size:14px}
.btn.ghost{background:transparent;border:1px solid rgba(126,240,196,.4);color:var(--mint)}
.btn.danger{background:#e9695c;color:#fff}
.btn.sm{min-height:38px;font-size:14px;min-width:108px}
.btns{display:flex;flex-direction:column;gap:6px}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.stat{display:flex;justify-content:space-between;padding:7px 4px;font-size:14px;font-weight:700;color:var(--mute);border-bottom:1px solid rgba(255,255,255,.07)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--mute);font-weight:700;padding:8px 4px;line-height:1.4}
.h3{font-family:var(--display);font-weight:600;font-size:15px;color:var(--mint);padding:12px 4px 2px}
#selcard,#placebar{display:none;margin:0 10px 8px;padding:10px 12px;border-radius:18px;background:rgba(23,63,61,.98);border:1px solid rgba(126,240,196,.28)}
#selcard.show,#placebar.show{display:block}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc-top b{font-family:var(--display);font-weight:600;font-size:18px}
.sc-top span{font-size:13px;color:var(--mute);font-weight:700}
.sc-btns{display:flex;gap:8px;margin-top:8px}
.sc-btns .btn{flex:1;min-width:0;font-size:15px;padding:0 8px}
.x{width:36px;height:36px;min-width:36px;min-height:36px;border-radius:12px;border:0;background:var(--panel-2);color:var(--ink);font-size:18px;cursor:pointer}
#tabs{display:flex;gap:4px;padding:6px 6px 8px}
.tab{flex:1;min-width:0;min-height:46px;border:0;border-radius:14px;background:transparent;color:var(--mute);font-family:var(--display);font-weight:600;font-size:10.5px;padding:0;cursor:pointer}
.tab.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--mint)}
.tab.pulse{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{background:#6b3b35;color:#ffd7cf}}
@media (prefers-reduced-motion:reduce){.tab.pulse{animation:none;color:var(--amber)}.fl{animation-duration:2s}}
#wxo{position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,0);transition:background 2.5s}
#wxo.flash{background:rgba(255,255,255,.16)!important;transition:none}
#wxs{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.5s;background:radial-gradient(circle at 90% 3%,rgba(255,244,190,.8),rgba(255,214,110,.3) 20%,rgba(255,200,80,0) 46%)}
#radioBtn{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 92px);width:44px;height:44px;border-radius:50%;border:1px solid rgba(126,240,196,.3);background:rgba(15,47,46,.92);color:var(--ink);font-size:21px;line-height:1;cursor:pointer;padding:0;z-index:6;}
#np{position:absolute;right:64px;top:calc(env(safe-area-inset-top) + 98px);max-width:46vw;background:rgba(15,47,46,.92);border:1px solid rgba(126,240,196,.22);color:var(--ink);font-weight:800;font-size:13px;padding:7px 12px;border-radius:14px;opacity:0;transform:translateX(8px);transition:opacity .35s,transform .35s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:6}
#np.show{opacity:1;transform:none}
#achBtn{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 144px);width:44px;height:44px;border-radius:50%;border:1px solid rgba(126,240,196,.3);background:rgba(15,47,46,.92);font-size:21px;z-index:6;cursor:pointer;padding:0}
.bdg{display:none;margin-left:3px;min-width:15px;padding:0 4px;border-radius:9px;background:#e94b4b;color:#fff;font-size:10px;line-height:15px;vertical-align:top}
.pbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}.pbar i{display:block;height:100%;background:#7ef0c4;border-radius:3px}
.medals{font-size:13px;letter-spacing:-1px;white-space:nowrap;align-self:center}
#radioBtn.hit{border-color:var(--amber);box-shadow:0 0 14px var(--amber)}
#np.hit{color:var(--amber);border-color:var(--amber)}
#radio .rt.hit{color:var(--amber)}
#radio{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 144px);width:min(310px,86vw);max-height:52vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--panel);border-radius:18px;padding:12px;display:none;z-index:7;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#radio.open{display:block}
#radio .rn{font-size:13px;font-weight:800;color:var(--mint);margin:2px 0 8px}
#radio .rs{display:block;width:100%;text-align:left;min-height:44px;margin:4px 0;border-radius:12px;border:1px solid rgba(126,240,196,.18);background:rgba(255,255,255,.04);color:var(--ink);font-family:var(--display);font-weight:700;font-size:15px;padding:6px 12px;cursor:pointer}
#radio .rs small{display:block;font-family:var(--body);font-weight:700;font-size:11px;color:var(--mute)}
#radio .rs.on{background:var(--mint);color:#0b2a27;border-color:transparent}
#radio .rs.on small{color:#0b2a27}
#radio .rt{display:block;width:100%;text-align:left;border:0;background:none;color:var(--mute);font-weight:700;font-size:13px;padding:7px 8px;cursor:pointer;border-radius:8px}
#radio .rt.on{color:var(--mint);background:rgba(126,240,196,.1)}
#radio .rb{display:flex;gap:8px;margin-top:8px}
#radio .rb .btn{flex:1;min-width:0;font-size:14px;padding:0 8px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="wxo"></div><div id="wxs"></div>
  <div id="fl"></div>
  <div id="hud">
    <div class="chip" id="cMoney">
      <div class="lab">Caisse du magasin</div>
      <div class="big" id="money">¥ 0</div>
      <div class="sub" id="rate">0 ¥ / min</div>
    </div>
    <div class="chip" id="cRank">
      <div class="rk"><span>★</span><span id="rankN">1</span><small id="clock">08:00</small></div>
      <div class="bar"><i id="rankBar"></i></div>
      <div class="sub" id="rankTxt">0 clients</div>
    </div>
  </div>
  <div class="chip" id="evt"></div>
  <div id="toast" role="status"></div>
  <button id="radioBtn" aria-label="Radio">📻</button>
  <button id="achBtn" aria-label="Succès">🏆</button>
  <div id="np"></div>
  <div id="radio"></div>
  <div id="dock">
    <div id="selcard"></div>
    <div id="placebar"></div>
    <div id="sheet"></div>
    <nav id="tabs" aria-label="Menu du magasin">
      <button class="tab" data-tab="build" id="tabBuild">Bâtir</button>
      <button class="tab" data-tab="stock" id="tabStock">Stock</button>
      <button class="tab" data-tab="ups">Évoluer</button>
      <button class="tab" data-tab="staff">Équipe</button>
      <button class="tab" data-tab="gacha">Gacha</button>
      <button class="tab" data-tab="city">Ville<span id="jobBdg" class="bdg"></span></button>
      <button class="tab" data-tab="deliv">Livreur</button>
      <button class="tab" data-tab="shop">Magasin</button>
    </nav>
  </div>
</div>
<noscript>Ce jeu a besoin de JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Sons : tout est synthétisé (Web Audio), aucun fichier ---------- */
var Snd=(function(){
  var ctx=null,fx=null,mus=null,musLP=null,comp=null,noiseBuf=null,sfxOn=true,musOn=true,last={},timer=null,step=0,nextT=0,night=0;
  var rsel=0;try{var sv=JSON.parse(localStorage.getItem('konbini-hoshi-audio')||'{}');if(sv.s===false)sfxOn=false;if(sv.m===false)musOn=false;if(typeof sv.r==='number'&&sv.r>=0&&sv.r<=5)rsel=sv.r;}catch(e){}
  function persist(){try{localStorage.setItem('konbini-hoshi-audio',JSON.stringify({s:sfxOn,m:musOn,r:ps}));}catch(e){}}
  function init(){
    if(ctx){if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}return;}
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    try{ctx=new AC();}catch(e){ctx=null;return;}
    try{
      comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination);
      fx=ctx.createGain();fx.gain.value=0.3;fx.connect(comp);
      mus=ctx.createGain();mus.gain.value=0.17;musLP=ctx.createBiquadFilter();musLP.type='lowpass';musLP.frequency.value=3500;
      mus.connect(musLP);musLP.connect(comp);
      var cv=ctx.createConvolver(),rl=Math.floor(ctx.sampleRate*2.2),rb=ctx.createBuffer(2,rl,ctx.sampleRate);
      for(var ch2=0;ch2<2;ch2++){var rd=rb.getChannelData(ch2);for(var q=0;q<rl;q++)rd[q]=(Math.random()*2-1)*Math.pow(1-q/rl,3);}
      cv.buffer=rb;var wet=ctx.createGain();wet.gain.value=0.35;musLP.connect(cv);cv.connect(wet);wet.connect(comp);
      var n=Math.floor(ctx.sampleRate*1.5);noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate);var a=noiseBuf.getChannelData(0);for(var i=0;i<n;i++)a[i]=Math.random()*2-1;
      startMusic();
    }catch(e){ctx=null;}
  }
  function ok(name,ms){var n=Date.now();if(last[name]&&n-last[name]<ms)return false;last[name]=n;return true;}
  function tone(f,d,type,v,delay,f2){
    if(!ctx)return;var t=ctx.currentTime+(delay||0);
    var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v||0.2),t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(fx);o.start(t);o.stop(t+d+0.03);
  }
  function bell(f,d,v,delay){tone(f,d,'sine',v,delay);tone(f*2.01,d*0.6,'sine',v*0.35,delay);tone(f*3.99,d*0.3,'sine',v*0.12,delay);}
  function noise(d,v,delay,ftype,freq,q,f2){
    if(!ctx||!noiseBuf)return;var t=ctx.currentTime+(delay||0);
    var s=ctx.createBufferSource();s.buffer=noiseBuf;
    var f=ctx.createBiquadFilter();f.type=ftype||'lowpass';f.frequency.setValueAtTime(freq||1000,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+d);f.Q.value=q||1;
    var g=ctx.createGain();g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(fx);s.start(t,Math.random()*0.5,d+0.02);
  }

  /* ---------- Ambiance de la ville ---------- */
  var ambG=null,lay={},ambLv={birds:0,crickets:0,wind:0,rain:0,traffic:0},nextBird=0,nextCri=0,nextCar=0;
  function aTone(f,d,type,v,delay,f2){
    var t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v),t+Math.min(0.02,d*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ambG);o.start(t);o.stop(t+d+0.03);
  }
  function aNoise(d,v,delay,ftype,freq,q,f2,att){
    var t=ctx.currentTime+(delay||0),s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    var f=ctx.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+d);f.Q.value=q||1;
    var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(att||0.01));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(ambG);s.start(t,Math.random());s.stop(t+d+0.05);
  }
  function loopLayer(ftype,freq,q){
    var s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    var f=ctx.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q||0.7;
    var g=ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(ambG);s.start();
    return {f:f,g:g};
  }
  function ensureAmb(){
    if(ambG||!ctx||!noiseBuf)return !!ambG;
    ambG=ctx.createGain();ambG.gain.value=sfxOn?1:0;ambG.connect(comp);
    lay.wind=loopLayer('bandpass',380,0.6);lay.rain=loopLayer('highpass',1800,0.5);lay.traffic=loopLayer('lowpass',160,0.7);
    return true;
  }
  function birdCall(){
    var n=2+Math.floor(Math.random()*4),base=2600+Math.random()*1800,kind=Math.random();
    for(var i=0;i<n;i++){
      var dl=i*(0.09+Math.random()*0.08);
      if(kind<0.5)aTone(base*(1+Math.random()*0.15),0.07,'sine',0.03,dl,base*1.35);
      else aTone(base*1.3,0.11,'sine',0.028,dl,base*0.85);
    }
  }
  function cricket(){
    var f=4300+Math.random()*500;
    for(var r=0;r<3;r++)for(var i=0;i<4;i++)aTone(f,0.025,'triangle',0.016,r*0.32+i*0.045);
  }
  function carPass(){aNoise(2.2,0.05,0,'bandpass',220,0.9,520,1.0);}
  function ambient(o){
    if(!ctx||ctx.state!=='running'||!ensureAmb())return;
    var t=ctx.currentTime;
    ambG.gain.setTargetAtTime(sfxOn?1:0,t,0.3);
    if(!sfxOn)return;
    var wv=0.012+0.09*o.wind,gust=0.6+0.4*Math.sin(t*0.37)*Math.sin(t*0.13);
    lay.wind.g.gain.setTargetAtTime(wv*gust,t,1.2);lay.wind.f.frequency.setTargetAtTime(300+200*gust,t,1.5);
    lay.rain.g.gain.setTargetAtTime(0.045*o.rain,t,1.0);
    lay.traffic.g.gain.setTargetAtTime(0.05*o.traffic,t,1.5);
    if(o.birds>0.02&&t>nextBird){birdCall();nextBird=t+(1.2+Math.random()*4)/o.birds;}
    if(o.crickets>0.02&&t>nextCri){cricket();nextCri=t+(1.0+Math.random()*0.8)/Math.max(0.3,o.crickets);}
    if(o.traffic>0.05&&t>nextCar){carPass();nextCar=t+(4+Math.random()*8)/o.traffic;}
  }
  function trainPass(){
    if(!ctx||!sfxOn||!ensureAmb())return;
    aNoise(7,0.11,0,'lowpass',140,0.8,null,1.5);aNoise(7,0.03,0,'bandpass',900,2,null,1.5);
    for(var i=0;i<14;i++){var d=0.6+i*0.42;aNoise(0.08,0.06,d,'bandpass',1400,3);aNoise(0.08,0.05,d+0.12,'bandpass',1200,3);}
    aTone(660,0.5,'square',0.012,0.2);aTone(550,0.6,'square',0.012,0.75);
  }
  function arp(notes,gap,type,v,d){notes.forEach(function(f,i){tone(f,d||0.18,type||'triangle',v||0.2,i*gap);});}
  var R=function(x){return x*(1+(Math.random()-0.5)*0.05);};

  var LIB={
    tap:function(){tone(740,0.05,'triangle',0.18);tone(1100,0.04,'triangle',0.1,0.025);},
    sel:function(){tone(520,0.05,'sine',0.14);},
    place:function(){tone(150,0.16,'sine',0.7,0,55);noise(0.08,0.25,0,'lowpass',900);bell(784,0.35,0.12,0.07);},
    rot:function(){tone(520,0.03,'square',0.08);tone(780,0.03,'square',0.08,0.045);},
    sell:function(){arp([1175,988,784,622],0.06,'square',0.07,0.1);},
    up:function(){arp([523,659,784,1047],0.07,'triangle',0.2,0.2);bell(1568,0.4,0.08,0.28);},
    buy:function(){tone(659,0.1,'square',0.09);tone(880,0.16,'square',0.09,0.09);bell(1760,0.35,0.08,0.18);},

      var m=new T.Mesh(hlGeo,st==='ok'?hlOK:hlBad);
      m.rotation.x=-Math.PI/2;m.position.set(x+0.5,FLOOR_Y+0.012,z+0.5);hl.add(m);
      if(st==='ok'&&needsAccess(placing.type)){
        var a=new T.Mesh(arrowGeo,arrowMat);
        a.position.set(x+0.5,FLOOR_Y+0.02,z+0.5);a.rotation.y=placing.r*Math.PI/2;hl.add(a);
      }

}

/* ---------- Grille et chemins ---------- */
function rebuildOcc(){
  occ=[];for(var x=0;x<W;x++){occ.push(new Array(D).fill(null));}
  S.items.forEach(function(it){if(!it.held&&it.x<W&&it.z<D)occ[it.x][it.z]=it;});
  updateGlow();
}
function bfs(sx,sz,tx,tz){
  if(sx===tx&&sz===tz)return [[sx,sz]];
  var prev={},start=sx*64+sz,goal=tx*64+tz,qu=[[sx,sz]];prev[start]=-1;
  while(qu.length){
    var cur=qu.shift();
    for(var k=0;k<4;k++){
      var nx=cur[0]+DIRS[k][0],nz=cur[1]+DIRS[k][1];
      if(nx<0||nz<0||nx>=W||nz>=D)continue;
      var key=nx*64+nz;
      if(prev[key]!==undefined)continue;
      if(occ[nx][nz])continue;
      prev[key]=cur[0]*64+cur[1];
      if(key===goal){
        var path=[],c=key;
        while(c!==-1){path.push([Math.floor(c/64),c%64]);c=prev[c];}
        return path.reverse();
      }
      qu.push([nx,nz]);
    }
  }
  return null;
}
function floodFrom(sx,sz){
  var seen={},qu=[[sx,sz]];seen[sx*64+sz]=1;
  while(qu.length){
    var cur=qu.shift();
    for(var k=0;k<4;k++){
      var nx=cur[0]+DIRS[k][0],nz=cur[1]+DIRS[k][1];
      if(nx<0||nz<0||nx>=W||nz>=D)continue;
      var key=nx*64+nz;
      if(seen[key]||occ[nx][nz])continue;
      seen[key]=1;qu.push([nx,nz]);
    }
  }
  return seen;
}
function layoutOK(extra){
  if(occ[DOORX][D-1])return false;
  var seen=floodFrom(DOORX,D-1);
  var list=live().concat(extra?[extra]:[]);
  for(var i=0;i<list.length;i++){
    var it=list[i];if(!needsAccess(it.type))continue;
    var f=frontOf(it);
    if(f.cx<0||f.cz<0||f.cx>=W||f.cz>=D||occ[f.cx][f.cz]||!seen[f.cx*64+f.cz])return false;
  }
  return true;
}
function cellStatus(x,z){
  if(x<0||z<0||x>=W||z>=D)return 'out';
  if(occ[x][z])return 'occ';
  if(x===DOORX&&z===D-1)return 'door';
  var t=placing?placing.type:'snack',tmp={x:x,z:z,type:t,held:false,r:placing?placing.r:0};
  if(needsAccess(t)){
    var f=frontOf(tmp);
    if(f.cx<0||f.cz<0||f.cx>=W||f.cz>=D||occ[f.cx][f.cz])return 'front';
  }
  occ[x][z]=tmp;
  var ok=layoutOK(tmp);
  occ[x][z]=null;
  return ok?'ok':'block';
}
function cellOf(c){return [clamp(Math.floor(c.g.position.x),0,W-1),clamp(Math.floor(c.g.position.z),0,D-1)];}
function adjacentSpot(it){
  var f=frontOf(it);
  if(f.cx<0||f.cz<0||f.cx>=W||f.cz>=D||occ[f.cx][f.cz])return null;
  return [f.cx,f.cz];
}
function regFront(r){
  var f=frontOf(r);
  if(f.cx<0||f.cz<0||f.cx>=W||f.cz>=D||occ[f.cx][f.cz])return null;
  return f;
}

/* ---------- Acteurs (clients et employés) ---------- */
function setPath(c,cx,cz,extra){
  var cc=cellOf(c),cells=bfs(cc[0],cc[1],cx,cz),pts=[];
  if(cells){
    for(var i=1;i<cells.length;i++)pts.push({x:cells[i][0]+0.5+c.jx,z:cells[i][1]+0.5+c.jz});
    if(cells.length===1)pts.push({x:cx+0.5+c.jx,z:cz+0.5+c.jz});
  }else{
    pts.push({x:cx+0.5,z:cz+0.5});
  }
  c.path=pts.concat(extra||[]);c.destCell=[cx,cz];c.extra=extra||[];c.state='walk';
}
function repathAll(){
  customers.concat(staffActors).forEach(function(c){
    if(c.state==='walk'&&c.destCell&&c.g.position.z<D-0.1){
      var cb=c.onArrive;setPath(c,c.destCell[0],c.destCell[1],c.extra);c.onArrive=cb;
    }
  });
}
function faceTo(c,dx,dz,dt){
  var a=Math.atan2(dx,dz),cur=c.g.rotation.y,d=a-cur;
  while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  c.g.rotation.y=cur+d*Math.min(1,dt*12);
}
function animActor(c,dt,moving){
  var u=c.g.userData;
  if(moving){c.phase+=dt*9;}
  var sw=moving?Math.sin(c.phase)*0.7:0;
  u.legL.rotation.x=u.legL.rotation.x*(moving?0:0.8)+sw*(moving?1:0);
  u.legR.rotation.x=u.legR.rotation.x*(moving?0:0.8)-sw*(moving?1:0);
  u.armL.rotation.x=-sw*0.8;u.armR.rotation.x=sw*0.8;
  var p=c.g.position;
  var gy=p.z<D+0.1?FLOOR_Y:p.z>D+8&&S.nb.station?platY(p.x,p.z):0.06;
  p.y=gy+(moving?Math.abs(Math.sin(c.phase))*0.03:0);
}
function platY(x,z){
  var q=plotOf('station'),lx=x-q.x,lz=z-q.z;
  if(Math.abs(lx)<4.8&&lz>2.5&&lz<4.25)return 0.44;
  if(Math.abs(lx+3.6)<0.8&&lz>1.6&&lz<=2.5)return 0.06+0.38*(lz-1.6)/0.9;
  return 0.06;
}
function moveActor(c,dt){
  var p=c.g.position,moving=false;
  if(c.path.length){
    var t=c.path[0],dx=t.x-p.x,dz=t.z-p.z,d=Math.hypot(dx,dz),step=c.speed*(c.kind==='staff'?stkMult:1)*dt;
    if(d<=step){
      p.x=t.x;p.z=t.z;c.path.shift();
      if(!c.path.length){var cb=c.onArrive;c.onArrive=null;if(cb)cb();}else moving=true;
    }else{p.x+=dx/d*step;p.z+=dz/d*step;moving=true;faceTo(c,dx,dz,dt);}
  }
  return moving;
}
function updateActor(c,dt){
  var moving=false;
  if(c.state==='walk'){moving=moveActor(c,dt);}
  else if(c.state==='wait'){
    c.t-=dt;
    if(c.t<=0){c.state='walk';var f=c.after;c.after=null;if(f)f();}
  }
  if(c.state==='queue')moving=c.qMoving;
  animActor(c,dt,moving);
}
function removeActor(c){
  scene.remove(c.g);
  customers=customers.filter(function(x){return x!==c;});
  staffActors=staffActors.filter(function(x){return x!==c;});
}
function wait(c,t,after){c.state='wait';c.t=t;c.after=after;}
function faceItem(c,it){
  var dx=it.g.position.x-c.g.position.x,dz=it.g.position.z-c.g.position.z;
  if(dx||dz)c.g.rotation.y=Math.atan2(dx,dz);
}

/* clients */
function inStock(){return live().filter(function(i){return stocked(i)&&i.stock>0;});}
function pickBasket(c){
  var pool=inStock();
  var k=1+(Math.random()<0.5?1:0)+(Math.random()<0.25?1:0)+(S.wx.cur!=='clear'&&Math.random()<0.15?1:0);
  if(c&&c.ctype==='kid')k=Math.min(k,2);
  k=Math.min(k,pool.length);
  var out=[];
  for(var n=0;n<k;n++){
    var tot=0,ws=pool.map(function(i){var w=(i.type==='atm'?0.5:i.type==='vending'?0.9:1)*wxW(i.type)*(c&&c.fav&&c.fav[i.type]?3:1);tot+=w;return w;});
    var r=Math.random()*tot,idx=0;
    for(var j=0;j<pool.length;j++){r-=ws[j];if(r<=0){idx=j;break;}}
    out.push(pool[idx]);pool.splice(idx,1);
  }
  return out;
}
function canServe(){
  var pool=inStock();
  if(!pool.length)return false;
  if(ofKind('register').length>0)return true;
  return pool.some(function(i){return CAT[i.type].kind==='direct';});
}

function startShopping(c){c.goals=pickBasket(c);nextGoal(c);}
function nextGoal(c){
  var it=c.goals.shift();
  if(!it){checkout(c);return;}
  if(it.held||S.items.indexOf(it)<0||it.stock<=0){nextGoal(c);return;}
  var sp=adjacentSpot(it);
  if(!sp){nextGoal(c);return;}
  setPath(c,sp[0],sp[1]);
  c.onArrive=function(){
    faceItem(c,it);
    wait(c,rnd(0.6,1.3),function(){takeItem(c,it);});
  };
}
function takeItem(c,it){
  if(S.items.indexOf(it)>=0&&!it.held&&it.stock>0){
    var price=itemPrice(it)*(c.sm||1);
    it.stock--;it.pulse=1;it.useT=simTime;statSale(c);Snd.machine(CAT[it.type].kind==='direct'?it.type:'pick');
    syncVis(it);updateAlert(it);
    if(it.stock===0&&simTime-emptyToast>6){emptyToast=simTime;Snd.play('warn');toast(CAT[it.type].n+' : rupture de stock !');}
    if(CAT[it.type].kind==='direct'){
      gain(price,it.g.position);countServed(c);
    }else{c.owed+=price;}
  }
  nextGoal(c);
}
function checkout(c){
  if(c.owed>0){
    var regs=ofKind('register').filter(function(r){return regFront(r);});
    if(regs.length){
      var best=null,bs=1e9;
      regs.forEach(function(r){var s=(r.q.length+(r.cur?0.5:0))*serviceTime(r);if(s<bs){bs=s;best=r;}});
      var f=regFront(best);
      setPath(c,f.cx,f.cz);
      c.onArrive=function(){
        if(S.items.indexOf(best)<0){checkout(c);return;}
        c.reg=best;c.state='queue';c.qMoving=false;best.q.push(c);
      };
      return;
    }
    c.owed=0;
  }
  afterPay(c);
}
function afterPay(c){
  var tables=ofType('table');
  if(tables.length&&Math.random()<0.3){
    var it=pick(tables),sp=adjacentSpot(it);
    if(sp){
      setPath(c,sp[0],sp[1]);
      c.onArrive=function(){faceItem(c,it);wait(c,rnd(4,8),function(){leaveShop(c);});};
      return;
    }
  }
  leaveShop(c);
}
function leaveShop(c){
  var side=Math.random()<0.5?-1:1;
  var ex=[{x:DOORX+0.5,z:D+0.7},{x:DOORX+0.5+side*8,z:D+1.1}];
  setPath(c,DOORX,D-1,ex);
  c.onArrive=function(){removeActor(c);};
}
function countServed(c){
  if(c.counted)return;
  c.counted=true;
  var before=rank();S.served++;statServed(c);
  var after=rank();
  if(after>before)onRankUp(after);
}
function gain(a,pos){
  a=Math.round(a);Snd.play('coin');S.money+=a;S.earned+=a;secEarn+=a;statEarn(a);
  floatAt(new T.Vector3(pos.x,pos.y+1.1,pos.z),'+¥'+fmt(a),'');
}
function onRankUp(r){
  Snd.play('fanfare');
  var news=Object.keys(CAT).filter(function(k){return CAT[k].rank===r;}).length+UPS.filter(function(u){return u.rank===r;}).length;
  toast('Rang ★'+r+' atteint ! '+(news?news+' nouveauté'+(news>1?'s':'')+' disponible'+(news>1?'s':'')+'.':''));
  floatAt(new T.Vector3(W/2,2.6,D/2),'Rang ★'+r,'rk');
  renderSheet();
}

/* ---------- Stock ---------- */
function fillItem(it,max){
  var take=Math.min(capOf(it)-it.stock,reserveOf(it.type),max||1e9);
  if(take<=0)return 0;
  S.reserve[it.type]=reserveOf(it.type)-take;
  it.stock+=take;syncVis(it);updateAlert(it);
  return take;
}
function fillAll(){
  var list=live().filter(function(i){return stocked(i)&&i.stock<capOf(i);});
  list.sort(function(a,b){return a.stock/capOf(a)-b.stock/capOf(b);});
  var tot=0;list.forEach(function(i){tot+=fillItem(i);});
  if(tot>0)Snd.play('fill');
  if(tot>0)toast(tot+' article'+(tot>1?'s':'')+' remis en rayon.');
  else toast('Rien à remplir : la réserve est vide ou les rayons sont pleins.');
  renderSheet();renderSel();save();
}
function orderStock(type,qty){
  var space=reserveCap()-reserveOf(type)-pendingQty(type);
  qty=Math.min(qty,space);
  if(qty<=0){toast('Réserve pleine pour ce produit.');return;}
  var cost=qty*unitCost(type);
  if(S.money<cost){toast('Pas assez de yens.');return;}
  S.money-=cost;S.pending.push({type:type,qty:qty});Snd.play('order');
  toast('Commande passée : le camion arrive.');
  renderSheet();save();
}
function deliver(){
  var tot=0;
  S.pending.forEach(function(p){S.reserve[p.type]=reserveOf(p.type)+p.qty;tot+=p.qty;});
  S.pending=[];truckDelivered=true;Snd.play('deliver');
  if(tot)toast('Livraison reçue : '+tot+' articles en réserve.');
  renderSheet();save();
}
function autoOrder(){
  if(!S.ups.autoorder)return;
  var types={};S.items.forEach(function(i){if(stocked(i))types[i.type]=1;});
  Object.keys(types).forEach(function(t){
    if(reserveOf(t)+pendingQty(t)>=25)return;
    var qty=Math.min(40,reserveCap()-reserveOf(t));
    var cost=qty*unitCost(t);
    if(qty>0&&S.money>cost*3){S.money-=cost;S.reserve[t]=reserveOf(t)+qty;}
  });
}

/* employés */
function syncStaff(){
  var regs=ofKind('register').filter(function(r){return !CAT[r.type].auto;}).sort(function(a,b){return a.id-b.id;});
  S.items.forEach(function(r){if(r.cashier)r.cashier.visible=false;});
  regs.forEach(function(r,i){r.cashier.visible=i<S.staff.cashier;});
  while(staffActors.length<S.staff.stocker)spawnStocker();
  while(staffActors.length>S.staff.stocker)removeActor(staffActors[staffActors.length-1]);
}
function spawnStocker(){
  var g=makePerson(staffLook());
  var box=bx(g,0.24,0.16,0.16,'#c9964a',0,0.38,0.17);
  var c={kind:'staff',g:g,box:box,path:[],state:'walk',speed:1.2,jx:rnd(-0.1,0.1),jz:rnd(-0.1,0.1),phase:rnd(0,6),qMoving:false,t:0,destCell:null,extra:[]};

function stockerNext(c){
  var pool=live().filter(function(i){return stocked(i)&&i.stock<capOf(i)&&reserveOf(i.type)>0&&adjacentSpot(i);});
  if(!pool.length){c.box.visible=false;wait(c,2,function(){stockerNext(c);});return;}
  pool.sort(function(a,b){return a.stock/capOf(a)-b.stock/capOf(b);});
  var it=pool[Math.floor(Math.random()*Math.min(2,pool.length))],sp=adjacentSpot(it);
  c.box.visible=true;
  setPath(c,sp[0],sp[1]);
  c.onArrive=function(){
    faceItem(c,it);c.box.visible=false;
    wait(c,rnd(1.2,2),function(){if(S.items.indexOf(it)>=0)fillItem(it,15);it.pulse=1;stockerNext(c);});
  };
}

/* ---------- Temps, éclairage ---------- */
var nightGrass=new T.Color('#243f33'),dayGrass=new T.Color('#6bb36a');
var cNight=new T.Color('#0b1830'),cDawn=new T.Color('#f2a07b'),cDay=new T.Color('#8fd3f4');
var tmpC=new T.Color();
function applyTime(){
  var h=S.clock/60;
  var day=Math.max(0,Math.sin((h-6)/12*Math.PI));
  day=Math.pow(day,0.6);
  var n=1-day;Snd.setNight(n);
  grassMat.color.copy(nightGrass).lerp(dayGrass,day);
  hemi.intensity=0.28+0.34*day;
  hemi.color.setHex(0xdfeeff).lerp(tmpC.set('#7a8fd0'),n*0.8);
  var a=((h-6)/12)*Math.PI;
  var cx=Math.cos(a)*16,cy=5+Math.max(0.2,Math.sin(a))*9;
  var dd=Math.min(1,day*1.6);sunOff.set((-7+cx*0.5)*dd+5*(1-dd),cy*dd+18*(1-dd),7*dd+6*(1-dd));
  sun.intensity=0.12+1.08*day;
  sun.color.set('#fff2dd').lerp(tmpC.set('#ff9a5a'),Math.max(0,1-day*2.5)*0.7);
  winMat.emissiveIntensity=0.08+0.9*n;
  lampMat.emissiveIntensity=0.55+0.5*n;
  lanternMat.emissiveIntensity=0.3+0.9*n;
  glowMat.opacity=0.34*n;glowSoft.opacity=0.2*n;
  pLights.forEach(function(pl){pl.intensity=1.2*n;});
  for(var mk in mcache){var mm=mcache[mk];if(mm.userData&&mm.userData.base)mm.emissiveIntensity=mm.userData.base*(0.75+0.6*n);}
  wxApply(day,n);
  var gk=(S.ups.streetlights?1:0)+':'+W+':'+D;if(gk!==glowKey){glowKey=gk;updateGlow();}
  var sky;
  if(day<0.35)sky=tmpC.copy(cNight).lerp(cDawn,day/0.35);else sky=tmpC.copy(cDawn).lerp(cDay,(day-0.35)/0.65);
  wxSky(sky,day);
  $('app').style.background='#'+sky.getHexString();
}

/* ---------- Caméra ---------- */
function fitCamera(){
  var vw=(W+D)*0.7071+4,vh=(W+D+5)*0.408+3.5;
  var aspect=innerWidth/innerHeight;
  baseHalf=Math.max(vh/2,vw/aspect/2);
  camTarget.set(W/2,0.4,D/2+1.2);
  resize();
}
function resize(){
  var w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  var a=w/h;
  camera.left=-baseHalf*a;camera.right=baseHalf*a;camera.top=baseHalf;camera.bottom=-baseHalf;
  camera.zoom=zoom;camera.updateProjectionMatrix();
}
function placeCam(){
  camera.position.set(camTarget.x+60,camTarget.y+57,camTarget.z+60);
  camera.lookAt(camTarget);
}
var rightV=new T.Vector3(1,0,-1).normalize(),fwdV=new T.Vector3(-1,0,-1).normalize();
function panBy(dx,dy){
  var wpp=(2*baseHalf/zoom)/innerHeight;
  camTarget.addScaledVector(rightV,-dx*wpp);
  camTarget.addScaledVector(fwdV,dy*wpp*1.73);
  camTarget.x=clamp(camTarget.x,-16,W+19);camTarget.z=clamp(camTarget.z,-14,D+22);
}
function setZoom(z){zoom=clamp(z,0.28,7);camera.zoom=zoom;camera.updateProjectionMatrix();
  var h=clamp(26/zoom,6,26),sc=sun.shadow.camera;
  if(Math.abs(sc.right-h)>0.5){sc.left=-h;sc.right=h;sc.top=h;sc.bottom=-h;sc.updateProjectionMatrix();renderer.shadowMap.needsUpdate=true;}
}

var toastT=null;
function toast(msg){
  var t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2600);
}
function floatAt(v,text,cls){
  camera.updateMatrixWorld();
  var p=v.clone().project(camera);
  var d=document.createElement('div');d.className='fl '+(cls||'');d.textContent=text;
  d.style.left=((p.x+1)/2*innerWidth)+'px';d.style.top=((1-p.y)/2*innerHeight)+'px';
  $('fl').appendChild(d);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},1400);
}

function nextUnlockNote(){
  var r=rank(),best=99;
  Object.keys(CAT).forEach(function(k){if(CAT[k].rank>r&&CAT[k].rank<best)best=CAT[k].rank;});
  UPS.forEach(function(u){if(u.rank>r&&u.rank<best)best=u.rank;});
  if(best===99)return '<div class="note">Tout est débloqué. Montez vos meubles au niveau maximum.</div>';
  return '<div class="note">Servez plus de clients pour atteindre le rang ★'+best+' et découvrir de nouveaux articles.</div>';
}

  var s=0,c=0;S.items.forEach(function(i){if(i.type===t){s+=i.stock;c+=capOf(i);}});

function ownedStockTypes(){
  var seen={},out=[];

/* ---------- Actions ---------- */
function startPlace(type,moveItem){
  placing={type:type,move:moveItem||null,r:moveItem?moveItem.r:0};
  selected=null;tabOpen=null;
  renderSheet();renderSel();renderPlace();refreshHighlights();
}
function endPlace(){
  placing=null;refreshHighlights();renderPlace();renderSheet();renderSel();
}
function attemptPlace(x,z){
  var st=cellStatus(x,z);
  if(st==='out')return;
  if(st==='occ'){toast('Cette case est déjà prise.');return;}
  if(st==='door'){toast("Gardez l'entrée dégagée.");return;}
  if(st==='front'){toast('Le devant du meuble doit rester dégagé. Touchez Pivoter.');return;}
  if(st==='block'){toast('Cela bloquerait le passage des clients.');return;}
  var p=placing;
  if(p.move){
    var it=p.move;it.x=x;it.z=z;it.r=p.r;it.held=false;it.g.visible=true;it.g.position.set(x+0.5,FLOOR_Y,z+0.5);it.g.rotation.y=it.r*Math.PI/2;it.pop=1;Snd.play('place');
    rebuildOcc();repathAll();syncStaff();placing=null;
    refreshHighlights();renderPlace();renderSheet();save();
    return;
  }
  var cost=costOf(p.type);
  if(uniq(p.type)&&owned(p.type)){toast('Un seul exemplaire possible.');placing=null;refreshHighlights();renderPlace();return;}
  if(S.money<cost){toast('Pas assez de yens.');return;}
  S.money-=cost;Snd.play('place');
  addItem(p.type,x,z,1,cost,p.r);
  rebuildOcc();repathAll();syncStaff();
  refreshHighlights();renderPlace();save();
}
function rotatePlace(){
  if(!placing)return;
  placing.r=(placing.r+1)%4;Snd.play('rot');
  refreshHighlights();
}
function rotateSel(){
  var it=selected;if(!it)return;
  var old=it.r;it.r=(old+1)%4;rebuildOcc();
  if(needsAccess(it.type)&&!layoutOK(null)){
    it.r=old;rebuildOcc();toast('Le devant du meuble doit rester dégagé.');return;
  }
  it.g.rotation.y=it.r*Math.PI/2;it.pop=1;Snd.play('rot');
  repathAll();save();
}
function upgradeSel(){
  var it=selected;if(!it)return;
  if(it.l>=maxLevel()){toast('Niveau max pour ce rang.');return;}
  var cost=upCost(it);
  if(S.money<cost){toast('Pas assez de yens.');return;}
  S.money-=cost;it.spent+=cost;it.l++;Snd.play('up');
  it.vis=visN(it);rebuildModel(it);updateAlert(it);renderSel();save();
}
function fillSel(){
  var it=selected;if(!it)return;
  if(it.stock>=capOf(it)){toast('Ce meuble est déjà plein.');return;}
  var n=fillItem(it);
  if(n)Snd.play('fill');

var last=performance.now(),accHud=0,accSave=0,accSec=0,accTime=0;
function update(dt){
  simTime+=dt;
  S.clock=(S.clock+dt*4)%1440;S.dn+=dt*4/1440;
  accTime+=dt;if(accTime>0.5){accTime=0;applyTime();}
  /* événements */
  if(S.evt){S.evt.left-=dt;if(S.evt.left<=0){S.evt=null;evTimer=rnd(140,260);}}
  else{evTimer-=dt;if(evTimer<=0){var e=pick(EVENTS);S.evt={n:e.n,t:e.t,s:e.s,left:e.dur};Snd.play('event');toast(e.n+' !');}}
  worldUpdate(dt);
  /* arrivées */
  if(canServe()&&customers.length<maxCust()){
    spawnAcc+=dt*0.17*trafficMult()*hourMult();
    if(spawnAcc>=1){spawnAcc=Math.min(spawnAcc-1,1);spawnCustomer();}
  }
  /* commandes automatiques */
  autoAcc+=dt;if(autoAcc>4){autoAcc=0;autoOrder();}
  /* acteurs */
  var i;
  for(i=customers.length-1;i>=0;i--)if(customers[i])updateActor(customers[i],dt);
  for(i=staffActors.length-1;i>=0;i--)if(staffActors[i])updateActor(staffActors[i],dt);
  /* caisses */
  S.items.forEach(function(r){
    if(CAT[r.type].kind!=='register'||r.held)return;
    var f=regFront(r);
    r.q=r.q.filter(function(c){return customers.indexOf(c)>=0;});
    if(r.cur&&r.q.indexOf(r.cur)<0)r.cur=null;
    if(!f)return;
    var fx=f.cx+0.5,fz=f.cz+0.5;
    r.q.forEach(function(c,k){
      var sx=fx+f.dx*k*0.42,sz=fz+f.dz*k*0.42,p=c.g.position;
      var dx=sx-p.x,dz=sz-p.z,d=Math.hypot(dx,dz),st=2.2*dt;
      if(d>0.02){var m=Math.min(1,st/d);p.x+=dx*m;p.z+=dz*m;c.qMoving=d>0.05;}
      else c.qMoving=false;
      c.g.rotation.y=Math.atan2(-f.dx,-f.dz);
    });
    if(!r.cur&&r.q.length){
      var c0=r.q[0],p0=c0.g.position;
      if(Math.hypot(fx-p0.x,fz-p0.z)<0.2){r.cur=c0;r.timer=serviceTime(r);Snd.play('beep');}
    }
    if(r.cur){
      r.timer-=dt;
      if(r.timer<=0){
        var c=r.cur;r.cur=null;r.q.shift();
        gain(c.owed,r.g.position);c.owed=0;countServed(c);
        r.pop=Math.max(r.pop,0.6);
        afterPay(c);
      }
    }
  });
  /* animations de meubles */
  S.items.forEach(function(it){
    if(it.pop>0){it.pop=Math.max(0,it.pop-dt*3);var s=1+0.16*Math.sin(it.pop*Math.PI);it.g.scale.set(s,s,s);}
    else if(it.pulse>0){it.pulse=Math.max(0,it.pulse-dt*4);var s2=1+0.05*Math.sin(it.pulse*Math.PI);it.g.scale.set(s2,s2,s2);}
    var tk=it.model&&it.model.userData.tick;if(tk)tk(simTime,dt,it);
    if(it.alert&&it.alert.visible)it.alert.position.y=1.95+Math.sin(simTime*5)*0.05;
  });
  var gt=gachaModel.userData.tick;if(gt)gt(simTime,dt,gachaObj);
  gachaHint.visible=!gachaBusy&&S.money>=gachaPrice()&&Object.keys(S.gacha.got).length<GACHA.length;gachaHint.position.y=1.55+Math.sin(simTime*3)*0.08;gachaHint.rotation.y=simTime*2;
  /* camion de livraison */
  if(!truck.visible){
    if(S.pending.length){truckTimer-=dt;if(truckTimer<=0&&roadFree(-12,D+3.5,1.6)){truck.visible=true;truckX=-12;Snd.play('truck');truckDelivered=false;}}
  }else{
    if(!roadBlocked(truckX+0.35,D+3.5,1,1.55,truck))truckX+=dt*3.2;truck.position.set(truckX,0.04,D+3.5);
    if(!truckDelivered&&truckX>=DOORX+0.5)deliver();

  }
  /* statistiques */
  accSec+=dt;
  if(accSec>=1){accSec-=1;S.avgRate=S.avgRate*0.9+secEarn*0.1;secEarn=0;}
  accHud+=dt;if(accHud>0.25){accHud=0;updateHud();}
  accSave+=dt;if(accSave>12){accSave=0;save();}pushRemote(false);
}

var perfAcc=0,perfN=0,perfLv=0,perfWait=4;
function perfWatch(dt){
  if(document.hidden||dt<=0)return;
  perfWait-=dt;if(perfWait>0)return;
  perfAcc+=dt;perfN++;
  if(perfAcc>=3){
    var avg=perfAcc/perfN;perfAcc=0;perfN=0;
    if(avg>0.026&&perfLv<2){
      perfLv++;perfWait=4;
      var pr=[1.5,1.2,1.0][perfLv],cur=Math.min(window.devicePixelRatio||1,pr);
      renderer.setPixelRatio(cur);resize();renderer.render(scene,camera);
    }
  }
}

function wxUpdate(dt){
  var w=S.wx,si=seasonIdx();
  if(lastSeason<0)ssv[si]=1;
  if(lastSeason>=0&&si!==lastSeason){toast(SEAS[si].e+' '+SEAS[si].n+' : une nouvelle saison commence !');Snd.play('event');var wl0=$('wxLeft');if(wl0)renderSheet();}
  lastSeason=si;
  for(var q=0;q<4;q++)ssv[q]+=((q===si?1:0)-ssv[q])*Math.min(1,dt*0.15);
  if(!wxValid(w.cur))w.left=0;
  if(!wxValid(w.next))w.next=pickWx(w.cur);
  w.left-=dt;
  if(w.left<=0){
    w.cur=w.next;w.next=pickWx(w.cur);w.left=rnd(130,240);
    Snd.play('event');
    toast(wxEmo(w.cur)+' '+(w.cur==='clear'?'Le ciel se dégage.':w.cur==='rain'?'Il se met à pleuvoir.':w.cur==='heat'?'Une vague de chaleur arrive.':'Il commence à neiger.'));
    var wl=$('wxLeft');if(wl)renderSheet();
  }
  var k=Math.min(1,dt*0.7);
  wf.rain+=((w.cur==='rain'?1:0)-wf.rain)*k;
  wf.heat+=((w.cur==='heat'?1:0)-wf.heat)*k;
  wf.snow+=((w.cur==='snow'?1:0)-wf.snow)*k;
  var cx=W/2,cz=D/2+3,i,p;
  if(wf.rain>0.02){
    rainMesh.visible=true;rainMesh.material.opacity=0.55*Math.min(1,wf.rain*1.5);

      p=rainP[i];p.y-=dt*17;p.x-=dt*1.6;
      if(p.y<0){p.y+=10;p.x=rnd(-15,15);p.z=rnd(-15,15);}
      var X=cx+p.x,Z=cz+p.z,o=i*6;
      rainA[o]=X;rainA[o+1]=p.y;rainA[o+2]=Z;rainA[o+3]=X+0.1;rainA[o+4]=p.y+0.55;rainA[o+5]=Z;
    }

  }else rainMesh.visible=false;
  if(wf.snow>0.02){
    snowMesh.visible=true;snowMesh.material.opacity=0.92*Math.min(1,wf.snow*1.5);
    for(i=0;i<SN;i++){
      p=snowP[i];p.y-=dt*1.5;p.x+=Math.sin(simTime*0.8+p.ph)*dt*0.5;p.z+=Math.cos(simTime*0.6+p.ph)*dt*0.3;

      snowA[i*3]=cx+p.x;snowA[i*3+1]=p.y;snowA[i*3+2]=cz+p.z;
    }

  }else snowMesh.visible=false;

      Snd.play('thunder');

}
function wxApply(day,n){

  var r=wf.rain,h=wf.heat,s=wf.snow,sn=Math.max(s,ssv[3]*0.85),au=ssv[2],sp=ssv[0];
  grassMat.color.lerp(tmpW.set('#9ccf5e'),0.35*sp*day);
  grassMat.color.lerp(tmpW.set('#b8964a'),0.5*au*day);
  grassMat.color.lerp(tmpW.set('#a9ad55'),0.55*h*day);
  grassMat.color.multiplyScalar(1-0.22*r);
  grassMat.color.lerp(tmpW.set('#e9f1f6').multiplyScalar(0.32+0.68*day),0.85*sn);
  SAKM.color.set('#f4a6c0').multiplyScalar(ssv[0]).add(tmpW.set('#58a24f').multiplyScalar(ssv[1])).add(tmpW.set('#d9822b').multiplyScalar(ssv[2])).add(tmpW.set('#e9eef2').multiplyScalar(ssv[3]*(0.4+0.6*day)));
  for(var gk in GRND)GRND[gk].color.set(gk).lerp(tmpW.set('#eef4f8').multiplyScalar(0.4+0.6*day),sn*0.8);
  headMat.emissiveIntensity=0.3+1.4*n;tailMat.emissiveIntensity=0.3+1.0*n;beamMat.opacity=0.8*n;beamMat.visible=n>0.05;
  waterMat.color.set('#5fb4d9').lerp(tmpW.set('#7d97a6'),0.4*r).lerp(tmpW.set('#dcebf2').multiplyScalar(0.45+0.55*day),ssv[3]*0.9);
  pineMat.color.set('#2f6b4a').lerp(tmpW.set('#e8f0f4'),0.5*sn);
  hemi.intensity*=1-0.35*r-0.1*s+0.1*h;
  sun.intensity*=1-0.6*r-0.35*s+0.15*h;
  roadMat.color.set('#3b434a').lerp(tmpW.set('#23282d'),r*0.8).lerp(tmpW.set('#aab4bd').multiplyScalar(0.4+0.6*day),Math.max(s,ssv[3]*0.5)*0.85);
  walkMat.color.set('#d4d7d2').lerp(tmpW.set('#a9aeb0'),r*0.7).lerp(tmpW.set('#f4f8fb').multiplyScalar(0.4+0.6*day),sn*0.9);
  for(var i=0;i<FOL.length;i++){
    FOL[i].color.set(FOLB[i]).lerp(tmpW.set('#a9b24f'),0.25*h).lerp(tmpW.set('#26402b'),0.18*r).lerp(tmpW.set('#d9822b'),0.7*au).lerp(tmpW.set('#ffb3c8'),0.3*sp).lerp(tmpW.set('#f2f7fa').multiplyScalar(0.4+0.6*day),0.6*sn);

  if(col!==wxCol){wxCol=col;var ov=$('wxo');if(ov)ov.style.background=col;}
  var so=Math.round(100*Math.min(1,h*day*1+ (S.wx.cur==='clear'?0.12*day*clamp((curTemp()-10)/15,0,1):0)*(1-h)))/100;
  if(so!==wxSunO){wxSunO=so;var se=$('wxs');if(se)se.style.opacity=so;}
}

function buildScooter(){
  var g=new T.Group(),m=new T.Group();g.add(m);
  bx(m,0.62,0.1,0.2,'#1fa463',0,0.12,0);
  bx(m,0.14,0.36,0.17,'#1fa463',0.3,0.12,0);

  [0.3,-0.28].forEach(function(x){var w=cyl(m,0.12,0.12,0.07,'#222222',x,0,0,10);w.rotation.x=Math.PI/2;w.position.y=0.12;});
  bx(m,0.3,0.28,0.28,'#1fa463',-0.36,0.3,0);
  bx(m,0.31,0.05,0.29,'#f4f1e6',-0.36,0.57,0);

  bx(m,0.06,0.05,0.06,headMat,0.4,0.36,0);bx(m,0.03,0.04,0.06,tailMat,-0.52,0.5,0);var sb=new T.Mesh(beamGeo,beamMat);sb.scale.set(1.0,1,0.55);sb.position.set(0.9,0.0,0);sb.renderOrder=2;m.add(sb);

  rider.userData.armL.rotation.x=-1.0;rider.userData.armR.rotation.x=-1.0;
  m.add(rider);

function syncScoots(){
  var want=S.dl.on?S.dl.fleet:0;
  while(scoots.length>want){var s=scoots.pop();scene.remove(s.g);}
  while(scoots.length<want){
    var g=buildScooter(),k=scoots.length,p=parkSpot(k);
    g.position.set(p.x,0.06,p.z);scene.add(g);
    scoots.push({g:g,st:'park',k:k,rev:0,n:0,t:0,wait:0,path:[]});
  }
  scoots.forEach(function(s,k){if(s.st==='park'){var p=parkSpot(k);s.g.position.set(p.x,0.06,p.z);s.g.rotation.y=0;}});
}
function weightedPick(pool){
  var tot=0,i;
  var ws=pool.map(function(it){var w=wxW(it.type);tot+=w;return w;});
  var r=Math.random()*tot;
  for(i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return i;}
  return pool.length-1;
}
function loadOrders(s,n){
  var rev=0,cnt=0,i,j;
  for(i=0;i<n;i++){
    var pool=inStock().filter(function(it){return CAT[it.type].kind==='prod';});
    if(!pool.length)break;
    var k=1+(Math.random()<0.4?1:0);
    for(j=0;j<k&&pool.length;j++){
      var idx=weightedPick(pool),it=pool.splice(idx,1)[0];
      if(it.stock<=0)continue;
      rev+=itemPrice(it)*1.25*(1+0.08*S.dl.app);
      it.stock--;it.pulse=1;it.useT=simTime;syncVis(it);updateAlert(it);
    }
    cnt++;
  }
  s.rev=Math.round(rev);s.n=cnt;
  return cnt;
}
function moveAlong(s,dt,speed){
  var p=s.g.position;
  if(!s.path.length)return true;
  var t=s.path[0],dx=t.x-p.x,dz=t.z-p.z,d=Math.hypot(dx,dz),st=speed*dt;
  var a=Math.atan2(-dz,dx),cur=s.g.rotation.y,df=a-cur;
  while(df>Math.PI)df-=2*Math.PI;while(df<-Math.PI)df+=2*Math.PI;
  if(d>0.05)s.g.rotation.y=cur+df*Math.min(1,dt*8);
  if(d<=st){p.x=t.x;p.z=t.z;s.path.shift();}
  else{p.x+=dx/d*st;p.z+=dz/d*st;}
  p.y=p.z<D+2.05?0.06:0.04;
  return s.path.length===0;
}
function dlUpdate(dt){
  if(!S.dl.on||!scoots.length)return;
  dlAcc+=dt*dlRate();
  while(dlAcc>=1){dlAcc-=1;dlPend=Math.min(dlPend+1,dlPendMax());}
  scoots.forEach(function(s){
    var p=parkSpot(s.k);
    if(s.st==='park'){
      if(dlPend>0){
        s.wait+=dt;
        if(dlPend>=dlCap()||s.wait>5){
          var n=Math.min(dlCap(),dlPend);dlPend-=n;
          var c=loadOrders(s,n);
          s.wait=0;
          if(c>0){
            s.st='out';s.path=[{x:p.x+0.3,z:D+2.5},{x:p.x+1.6,z:D+3.5},{x:W+18,z:D+3.5}];
            Snd.play('scoot');
          }else if(simTime-dlNoStockT>15){dlNoStockT=simTime;toast('Commandes en ligne annulées : plus de stock en rayon.');}
        }
      }else s.wait=0;
    }else if(s.st==='out'){
      if(moveAlong(s,dt,5.6)){s.st='away';s.t=dlTrip();s.g.visible=false;}
    }else if(s.st==='away'){
      s.t-=dt;
      if(s.t<=0){
        s.st='back';s.g.visible=true;s.g.position.set(W+18,0.04,D+5.3);s.g.rotation.y=Math.PI;
        s.path=[{x:p.x+2.2,z:D+5.3},{x:p.x+0.8,z:D+2.5},{x:p.x,z:D+1.35}];
      }
    }else if(s.st==='back'){
      if(moveAlong(s,dt,5.6)){
        s.st='park';s.g.rotation.y=0;s.g.position.set(p.x,0.06,p.z);
        if(s.rev>0){gain(s.rev,s.g.position);S.dl.done+=s.n;S.dl.gain+=s.rev;}
        s.rev=0;s.n=0;
        var dl=$('dlInfo');if(dl)dl.textContent=dlInfoText();
      }
    }
  });
}

var roadObs=[];
function gatherRoad(){

  envCars.forEach(function(c){if(!c.loop&&c.ax==='x')roadObs.push({x:c.t,z:c.lane,h:1.05,ref:c});});
  if(truck.visible)roadObs.push({x:truckX+0.35,z:D+3.5,h:1.55,ref:truck});

  if(trf.taxi&&trf.taxi.visible)roadObs.push({x:trf.taxiX,z:D+3.5,h:1.05,ref:trf.taxi});
  scoots.forEach(function(s){var p=s.g.position;if(s.g.visible&&p.z>D+2.6&&p.z<D+6.2)roadObs.push({x:p.x,z:p.z,h:0.45,ref:s.g});});
}
/* Vrai si un véhicule bloque la route devant (x,z) dans la direction dir. */
function roadBlocked(x,z,dir,h,self){
  for(var i=0;i<roadObs.length;i++){var o=roadObs[i];
    if(o.ref===self||Math.abs(o.z-z)>0.7)continue;
    var d=(o.x-x)*dir;if(d>0&&d<h+o.h+0.45)return true;}
  return false;
}
function roadFree(x,z,h){
  for(var i=0;i<roadObs.length;i++){var o=roadObs[i];if(Math.abs(o.z-z)<0.7&&Math.abs(o.x-x)<h+o.h+0.6)return false;}
  return true;
}
function envUpdate(dt){
  for(var q=0;q<envTicks.length;q++)envTicks[q](simTime);
  gatherRoad();

    var c=envCars[i];

      var blk=false;
      for(var k=0;k<envCars.length;k++){var o=envCars[k];if(o!==c&&o.loop===c.loop){var dd=(o.t-c.t+c.per)%c.per;if(dd>0&&dd<2.7){blk=true;break;}}}

function ambUpdate(dt){
  var hh=S.clock/60,sn=S.wx.cur==='rain'||S.wx.cur==='snow';
  for(var i=0;i<amb.length;i++){
    var a=amb[i],g=a.g,u=g.userData,sw=0;
    var on=hh>=a.hr[0]&&hh<a.hr[1]&&!(sn&&a.mode!=='route'&&(i%3)!==0);
    if(g.visible!==on)g.visible=on;
    if(!on)continue;
    if(a.mode==='seat'){a.ph+=dt*3;u.armL.rotation.x=-2.2+Math.sin(a.ph)*0.5;u.armR.rotation.x=-2.2-Math.sin(a.ph)*0.5;continue;}
    var tx,tz;
    if(a.mode==='wander'){
      if(a.w>0){a.w-=dt;continue;}
      tx=a.tx;tz=a.tz;
    }else{
      var wp=a.route[a.ri];tx=wp[0];tz=wp[1];
    }
    var dx=tx-g.position.x,dz=tz-g.position.z,d=Math.sqrt(dx*dx+dz*dz);
    if(d<0.12){
      if(a.mode==='wander'){a.w=rnd(0.4,a.run?1.5:3.5);a.tx=rnd(a.rect[0],a.rect[1]);a.tz=rnd(a.rect[2],a.rect[3]);}
      else if(a.route.length===2)a.ri=1-a.ri;
      else a.ri=(a.ri+1)%a.route.length;
      continue;
    }
    var st=Math.min(d,a.sp*(a.run?1.7:1)*dt);
    g.position.x+=dx/d*st;g.position.z+=dz/d*st;g.rotation.y=Math.atan2(dx,dz);
    a.ph+=dt*a.sp*(a.run?9:6);sw=Math.sin(a.ph)*0.6;
    u.legL.rotation.x=sw;u.legR.rotation.x=-sw;u.armL.rotation.x=-sw*0.8;u.armR.rotation.x=sw*0.8;
  }
}

    var wp=c.path[c.i],dx=wp.x-g.position.x,dz=wp.z-g.position.z,d=Math.sqrt(dx*dx+dz*dz);

    }
    var st=Math.min(d,1.7*dt);g.position.x+=dx/d*st;g.position.z+=dz/d*st;g.rotation.y=Math.atan2(dx,dz);
    g.position.y=g.position.z<D+0.1&&g.position.x>0&&g.position.x<W&&g.position.z>0?FLOOR_Y:0.06;
